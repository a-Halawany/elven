# The Eye — local development profile (the only profile in Phase 0; see EXC-P0-004)
# Remediation R7:
#  - images pinned by IMMUTABLE DIGEST (recorded in conformance.manifest.json;
#    human-readable tags: postgres:18-alpine / redis:8-alpine — alpine variants
#    chosen for the clean HIGH/CRITICAL OS baseline, see evidence/supply-chain/)
#  - 2026-09-10 re-pin (TEMPORARY, owner-approved: docs/images/DERIVED_IMAGES_APPROVAL.md):
#    the two references below are the derived maintenance images published by
#    .github/workflows/publish-derived-images.yml (run 34502081248) from the recipes in
#    infra/images/candidates/v2/ — the previously pinned official indexes
#    (postgres:18-alpine 9a8afca5…, redis:8-alpine 978f0e01…) plus the util-linux, OpenSSL
#    and c-ares fixes and an explicit non-root USER. Each service returns to a verified
#    official image through the digest/disposition/release process once one qualifies on
#    both platforms (scripts/gate/check-patched-images.mjs watches for it); never by an
#    automatic re-pin.
#  - PostgreSQL and Redis bind to LOOPBACK ONLY
#  - Redis requires authentication (EYE_REDIS_PASSWORD)
#  - no default operational secrets in executable paths: required env vars fail
#    the profile fast when unset
services:
  postgres:
    image: ghcr.io/a-halawany/elven/postgres@sha256:69a974aedbd80ff27ee670a6693445c47925bd69e11818a1cff39319f91ad4a7 # ghcr.io/a-halawany/elven/postgres:18-alpine-maint-20260910 (index; derived from postgres:18-alpine 9a8afca5…)
    container_name: eye-postgres
    # Process protections (2026-09-10; infra/images/candidates/README.md "v3", process
    # protections; measured in infra/images/candidates/evidence/v3/process-protections.txt).
    # The pinned base drops to uid 70 through gosu but keeps Docker's default capability
    # bounding set (CapBnd 00000000a80425fb, NoNewPrivs 0); the v3 candidate (USER postgres)
    # is the same. The three keys below make PID 1 and every backend run as uid 70 / gid 70
    # with CapEff = CapBnd = 0 and NoNewPrivs = 1, on the pinned base AND on v3 (same
    # entrypoint non-root path; initdb, chmod of PGDATA, pg_ctl, pg_isready, pg_dump all
    # verified under these flags). `user:` is required: with cap_drop alone the base's root
    # entrypoint cannot chmod/chown/gosu and exits 1. The root-only repair steps of the
    # entrypoint (chown of PGDATA) no longer run; eye-pgdata was initialised by this base
    # and is owned by uid 70 (verified), which is the layout verified here.
    # Since the 2026-09-10 re-pin the pinned image IS the v3 candidate (USER postgres), so the
    # keys below restate what its config already declares and remain required for the base.
    # NOT applied to the running eye-postgres: it takes effect at the next governed
    # recreation of the container (a recreate is a separate, recorded operation).
    user: "70:70"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: eye
      POSTGRES_PASSWORD: ${EYE_DB_PASSWORD:?EYE_DB_PASSWORD is required (no committed default)}
      POSTGRES_DB: eye
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18+ images place PGDATA under /var/lib/postgresql/<major>; mount the parent.
      - eye-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eye -d eye"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: ghcr.io/a-halawany/elven/redis@sha256:1ad0ff24136a22ef4b2457aa3fde26c65c51bebe6c1f719158e21219f6ae3e15 # ghcr.io/a-halawany/elven/redis:8-alpine-maint-20260910 (index; derived from redis:8-alpine 978f0e01…)
    container_name: eye-redis
    # Process protections (2026-09-10; same references as above). The pinned base's
    # entrypoint runs setpriv, which leaves redis-server at uid 999 with CapBnd 0 and
    # NoNewPrivs 1; the v3 candidate (USER redis) never reaches setpriv and would run with
    # Docker's default bounding set and NoNewPrivs 0. The three keys below restore the
    # base's state (CapEff = CapBnd = 0, NoNewPrivs 1, uid 999 / gid 1000) independently of
    # the entrypoint, on the pinned base AND on v3 (PING/SET/GET, SAVE/BGSAVE, loading a
    # base-written dump.rdb and the healthcheck verified under these flags). `user:` is
    # required: with cap_drop alone the base's entrypoint fails its has_cap setuid test,
    # skips setpriv and runs redis-server as uid 0 (measured). There is no redis volume,
    # so the entrypoint's root-only fix_data_dir_perms step is not needed.
    # Since the 2026-09-10 re-pin the pinned image IS the v3 candidate (USER redis), which never
    # reaches setpriv: the three keys below are what restore CapBnd 0 / NoNewPrivs 1 for it.
    # NOT applied to the running eye-redis: it takes effect at the next governed
    # recreation of the container.
    user: "999:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--requirepass", "${EYE_REDIS_PASSWORD:?EYE_REDIS_PASSWORD is required (no committed default)}"]
    environment:
      REDIS_HEALTHCHECK_PASSWORD: ${EYE_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_HEALTHCHECK_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eye-pgdata:
