[[allowlists]]
description = """
B36 history 4/4 — the strategy commit a272fb7 carried the fixed key ID
`ed25519:0123456789abcdef` in the web unit fixture apps/web/lib/health.test.ts; the rule
keyed on the word `key` in the expected sentence "signed Ed25519 with key ed25519:…" and
