# Gitleaks configuration — the secret scan is BLOCKING, so false positives must be
# narrowed precisely rather than by disabling rules or ignoring whole paths.
[extend]
useDefault = true

# The generated LOCAL secret handoff is gitignored and, by design, contains real
# per-environment generated material (0600). It can never enter the repository, so
# a finding there is expected rather than a leak. Everything TRACKED is still
# scanned: `gitleaks git .` (history + the final source candidate) must be clean,
# and so must `gitleaks dir .` outside this path.
[allowlist]
description = "Gitignored local secret handoff and transient run state"
paths = [
  '''^\.eye-local/''',
  '''^evidence/''',
  '''^test-results/''',
  '''^node_modules/''',
  # Build output (gitignored): Next.js writes generated preview/prerender ids
  # into .next manifests, which are not repository secrets.
  '''(^|/)\.next/''',
  '''(^|/)dist/''',
]

[[rules]]
id = "generic-api-key"
description = "Generic API Key (default rule, narrowed for SQL column identifiers)"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
[rules.allowlist]
description = """
Migration 0009/0010 declare SQL identifiers such as `context_key_hash`,
`refresh_token_hash` and `secret_hash` — these are COLUMN NAMES for stored
hashes, never secret values. No literal secret exists in any migration: role
passwords are __EYE_DB_*_PASSWORD__ placeholders substituted from the
environment by the migration runner.
"""
paths = ['''apps/api/migrations/.*\.sql''']
regexes = [
  '''context_key_hash''',
  '''refresh_token_hash''',
  '''secret_hash''',
  '''p_ctx_key_hash''',
  '''__EYE_DB_[A-Z_]+_PASSWORD__''',
]
