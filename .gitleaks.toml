# GOVERNED gitleaks configuration (Gate-2.2 C15).
#
# This file EXTENDS the upstream default ruleset and only ever NARROWS scope. No
# rule is disabled. Every exclusion below is justified, is as narrow as the finding
# it addresses, and — for path exclusions — is PROVEN by the gate to cover a path
# git cannot carry (untracked AND ignored), so it can never conceal a committed
# secret. scripts/gate/supply-chain.mjs asserts that proof on every run.
title = "The Eye — Gate-2.2 secret scanning"

[extend]
useDefault = true

# ── 1. Generated, never-committed secret material and build output ────────────
[[allowlists]]
description = """
Paths git cannot carry, asserted untracked AND ignored by the gate on every run:

  .eye-local/       per-environment secret material generated by
                    scripts/local-env.mjs (mode 0600). It is REAL secret material by
                    design, which is why the working-tree scan matches it.
  apps/web/.next/   Next.js build output. The framework writes its own ephemeral
                    previewModeSigningKey / encryptionKey values into cache and
                    manifest files on every build; they are regenerated per build
                    and are not project secrets.

The FULL-HISTORY scan is unaffected by these paths — neither has ever been
committed, which the gate proves rather than assumes.
"""
paths = [
  '''(^|/)\.eye-local/''',
  '''(^|/)apps/web/\.next/''',
]

# ── 2. A SQL COLUMN NAME, not a credential ───────────────────────────────────
[[allowlists]]
description = """
FALSE POSITIVE, scoped as narrowly as the finding: inside the migration SQL, the
identifier `context_key_hash` is a COLUMN NAME appearing in SELECT lists, e.g.

  SELECT s2.id, s2.principal_id, s2.assurance, s2.status, s2.expires_at,
         s2.context_key_hash, s2.bound_epoch

The generic-api-key rule keys on the word `key` followed by a token and matches the
next column reference. The stored value is a SHA-256 HASH of a context key, never a
key; and no literal secret appears in any migration.

This allowlist requires BOTH conditions (condition = AND): the file must be a
migration AND the match must be that identifier. Every other rule, every other
match, and every other file remain fully in scope — migrations are source and are
NOT path-excluded.
"""
condition = "AND"
paths = ['''(^|/)apps/api/migrations/.*\.sql$''']
regexTarget = "match"
regexes = ['''context_key_hash''']

# ── 3. ENGLISH PROSE in a records document, not a credential ─────────────────
[[allowlists]]
description = """
FALSE POSITIVE, scoped as narrowly as the finding — to ONE rule, ONE file, ONE
phrase and ONE commit.

The C18.1.11 records section describes which columns of the post-upgrade refresh
row are authenticated, and the sentence read:

  ... the refresh token's session, family, generation,
  token hash, replacement/reuse/invalidation state, timestamps and id ...

The generic-api-key rule keys on the word `token` followed by a value-shaped run of
characters and matched the next words, `replacement/reuse/invalidation`. That is an
English phrase naming three nullable columns; no credential is involved, and the
gate's own canary controls assert that no provider token or private key appears in
the repository, the logs or the evidence archive.

The WORKING TREE was corrected by rewording, so this exclusion exists solely for the
single historical commit that already carries the original sentence. It is pinned to
that commit id, so the same phrase appearing anywhere else — in another file, in a
later commit, or under any other rule — remains fully in scope.

All three conditions must hold (condition = AND): the commit, the file and the match.
"""
condition = "AND"
commits = ['''6d702d28252ee749b23c862f264fede060fed5df''']
paths = ['''(^|/)GATE2_2_FINAL_CLOSURE_PLAN\.md$''']
regexTarget = "match"
regexes = ['''replacement/reuse/invalidation''']

# ── 4. A PUBLISHED URL PARAMETER of an open-data endpoint, not a credential ──
[[allowlists]]
description = """
FALSE POSITIVE, scoped as narrowly as the finding — to ONE rule and ONE exact
literal.

The EU Financial Sanctions Files (FSF) download endpoint is addressed as

  https://webgate.ec.europa.eu/fsd/fsf/public/files/<file>/content?token=<value>

The `token` parameter is PRINTED IN THE PUBLIC EU OPEN DATA PORTAL METADATA and in
the public RSS feed's own <link> elements; it is a fixed, published path component
of an anonymous open-data endpoint, not an issued credential, and it authenticates
nobody. Its value decodes to the ASCII string "token-2017".

The generic-api-key rule keys on the word `token` followed by a value-shaped run of
characters, so every place the Phase 1 source documentation, source contract or
replay manifest records that endpoint URL is matched.

Scope: this allowlist matches the ONE exact literal. Any other token=, any other
value, and every other rule remain fully in scope. The value is additionally covered
at runtime by the PHASE1_PLAN §8.1 URL-query redaction, which strips query strings
from logs, events and audit metadata regardless of this exclusion — the system never
treats it as a secret, and equally never stores it as one.
"""
regexTarget = "match"
regexes = ['''token=dG9rZW4tMjAxNw''']

# ── 5. A FILE DIGEST in a container-layer listing, not a credential ──────────
[[allowlists]]
description = """
FALSE POSITIVE, scoped as narrowly as the finding — to ONE rule, ONE file, ONE
literal and TWO commits.

The derived-image reproducibility evidence lists every file of the rebuilt apk
layer with a truncated SHA-256 and its mtime. One line read:

  ./usr/lib/engines-3/capi.so   sha=7891a5d69534db2e   mtime=...   size=67168

The generic-api-key rule keys on the letters `api` inside the OpenSSL engine name
`capi.so`, followed within a few characters by `sha=` and a value-shaped run of hex.
The value is the digest prefix of a PUBLIC library file shipped by Alpine's openssl
package (`/usr/lib/engines-3/capi.so`); no credential is involved.

The WORKING TREE was corrected by putting the digest column first (no `=` follows a
path any more), so this exclusion exists solely for the two historical commits that
carry the original layout. It is pinned to those commit ids, that file and that
literal; the same digest appearing anywhere else, and every other rule, remain fully
in scope. All three conditions must hold (condition = AND).
"""
condition = "AND"
commits = ['''a269debe51dc34023dce87102058dbb5d8129d44''', '''5f84fe20b2e46fcea6a6f5ed1bb692b54e1f2db2''']
paths = ['''(^|/)infra/images/candidates/evidence/v2/reproducibility-redis\.txt$''']
regexTarget = "match"
regexes = ['''capi\.so\tsha=7891a5d69534db2e''']

# ── 6. UPSTREAM COMMIT URLS in a vulnerability-database report, not credentials ─
[[allowlists]]
description = """
FALSE POSITIVE, scoped as narrowly as the finding — to ONE rule, ONE file and ONE
URL shape.

The arm64 govulncheck evidence (`infra/images/published/20260910/
gosu-arm64-3a8ef022.govulncheck.json`, the `-json` output of govulncheck v1.1.4 on
the published arm64 gosu binary, kept whole so every OSV entry and finding it
reports can be read) carries the Go vulnerability database's own reference URLs,
which cite the FIX commits of the Go repositories (`go`, `net`, …):

  "url": "https://go.googlesource.com/go/+/cd3b4ca9f20fd14187ed4cdfdee1a02ea87e5cd8"
  "url": "https://go.googlesource.com/net/+/89ef3d95e781148a0951956029c92a211477f7f9"

The sourcegraph-access-token rule keys on a bare 40-hex run after the letters
`source` (here inside the hostname `googlesource`) and matched 59 such commit ids.
They are public upstream commit identifiers published by https://vuln.go.dev; no
credential is involved.

Scope: the rule (targetRules — the key gitleaks 8.30.1 reads; B36-F1 found the earlier
spelling `rules` was not read, so the block was path-and-match only), the one file, and
only a match that sits inside a `go.googlesource.com/<repo>/+/<40 hex>` URL
(regexTarget = line). The same hex anywhere else, any other file, and every other rule
remain fully in scope. All three conditions must hold (condition = AND).
"""
condition = "AND"
targetRules = ['''sourcegraph-access-token''']
paths = ['''(^|/)infra/images/published/20260910/gosu-arm64-3a8ef022\.govulncheck\.json$''']
regexTarget = "line"
regexes = ['''go\.googlesource\.com/[a-z]+/\+/[0-9a-f]{40}''']

# ── 7. A JSON KEY NAME in the health-score migration, not a credential ───────
[[allowlists]]
description = """
FALSE POSITIVE, scoped as narrowly as the finding — to ONE rule, ONE file and ONE
match. In migration 0089 (B32 §H, executive.health_sensitivity) a jsonb object is
built from key/value pairs:

  jsonb_build_object('key', p_parts -> i -> 'key', 'weight_plus_10pct', v_u, ...)

The generic-api-key rule keys on the word `key` followed by a quoted token and
matched the NEXT key NAME, 'weight_plus_10pct' — a sensitivity field of the
decomposable score, not a secret. The migration is applied (its digest is locked
on the demonstration) and migrations are forward-only, so the text cannot be
reworded; the exclusion is recorded here instead.

Scope: the rule (targetRules — see block 6), the one migration, and only the literal
match `key', 'weight_plus_10pct'`. All three conditions must hold (condition = AND).
"""
condition = "AND"
targetRules = ['''generic-api-key''']
paths = ['''(^|/)apps/api/migrations/0089_b32_strategy_exposures_health\.sql$''']
regexTarget = "match"
regexes = ['''^key', 'weight_plus_10pct'$''']

# ── 8–11. B36 HISTORY: key-shaped RECORD KEYS in four historical commits, not credentials
#
# Four commits of the B36 stage carry literals that the generic-api-key rule reads as
# secrets: a command view's key (`viewKey: 'executive/morning'`), a SYNTHETIC execution
# target's key (`targetKey: 'nordwerk-erp-synthetic-b36'`) and a fixed Ed25519 key ID in a
# web unit fixture (`key ed25519:0123456789abcdef`). None is a credential — each names a
# record by a human-readable key — and the WORKING TREE was corrected (each literal split
# as the repository's rule says) before the stage's candidate, so these exclusions exist
# solely so the FULL-HISTORY scan does not fail on the commits that carried the unsplit
# forms. Each block is ONE tuple: ONE rule, the commit that carries the finding, the exact
# file(s) and the exact anchored match (regexTarget = match — the rule's whole match, which
# for generic-api-key is `<keyword>: '<value>'` plus the closing delimiter). All four
# conditions must hold (condition = AND): the same literal in any other commit or file, any
# other value in these files (even in these commits), and every other rule remain fully in
# scope.
#
# B36-F1 (2026-09-30): the first form of this exception listed the commits, paths and
# regexes in ONE block without `condition = "AND"`, so gitleaks 8.30.1 — whose default is
# OR and whose commit/path check runs before any rule — skipped every listed file in every
# commit and every file in the four listed commits. Corrected here; the negative controls
# that prove the narrowing are in evidence/cp6/b36-f1-gitleaks-controls.txt.

[[allowlists]]
description = """
B36 history 1/4 — the records commit e0b8820 quoted the command view key `viewKey:
'executive/morning'` in PHASE6_REPORT.md and audit/CP6_BATCHES.md (one finding each).
ONE rule, ONE commit, TWO files, ONE exact match. condition = AND.
"""
condition = "AND"
targetRules = ['''generic-api-key''']
commits = ['''e0b8820dfe7f6661cb897653619f6befcbeeb76c''']
paths = ['''^PHASE6_REPORT\.md$''', '''^audit/CP6_BATCHES\.md$''']
regexTarget = "match"
regexes = ['''^viewKey: 'executive/morning'$''']

[[allowlists]]
description = """
B36 history 2/4 — the act commit 595c652 carried `viewKey: 'executive/morning'` in
scripts/phase6/act-b36.mjs (one finding). ONE rule, ONE commit, ONE file, ONE exact match.
condition = AND.
"""
condition = "AND"
targetRules = ['''generic-api-key''']
commits = ['''595c652def0dc7ee47cd41f7103428340df4f492''']
paths = ['''^scripts/phase6/act-b36\.mjs$''']
regexTarget = "match"
regexes = ['''^viewKey: 'executive/morning'$''']

[[allowlists]]
description = """
B36 history 3/4 — the collaboration harness commit 442d891 carried the synthetic
execution target's key `targetKey: 'nordwerk-erp-synthetic-b36'` twice in
apps/api/test/int/phase6-collab-b36.test.ts. ONE rule, ONE commit, ONE file, ONE exact
