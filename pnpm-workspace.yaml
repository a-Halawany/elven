packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - argon2
  - sharp
minimumReleaseAgeExclude:
  - dependency-cruiser@18.1.1
  - jose@6.2.8
allowBuilds:
  argon2: true
  msgpackr-extract: true
  sharp: true
# Security remediation of pnpm-audit findings (gate instruction 4; ADR-P0-01
# patching policy): force patched transitive versions under next.
#
# DIRECT PIN, recorded here because package.json carries no comments — apps/web `next` 16.3.6 → 16.3.8.
# C15 on #81 (ci 37702446651 at a4a1930, 2026-10-08): next >=16.0.0 <16.3.8 carries GHSA-cjq9-62q9-8jv4
# (HIGH — server-side request forgery in Image Optimization; path apps__web>next), and the same tree's
# audit counted five more next advisories below the blocking level, all patched >=16.3.8 (MODERATE
# GHSA-3w37-wq28-93x7, GHSA-4jqv-mc3x-m676, GHSA-f87g-xv8r-7p7x, GHSA-mcj8-r9mp-w47p; LOW GHSA-39w2-rjm5-chcv).
# EXACT REVIEWED VERSION, not a range, for the reason recorded below for nanoid: 16.3.8 is the first patched
# version, a patch release on the 16.3 line; it declares the same dependencies as 16.3.6 (only @next/env and
# the eight @next/swc-* binaries move with it, at 16.3.8), so the development closure (C17's
# DEVELOPMENT_COMPONENTS, 313) is unchanged. No eslint-config-next or other @next/* pin exists to move.
overrides:
  # C15 at 9aaf0311 (run 34343317671): sharp <0.35.4 carries GHSA-rgj7-g3m4-5g8c (HIGH — libheif
  # GHSA-g89c-p67h-r497 / GHSA-2jg2-4ch7-h545), reached only as next's optional image dependency.
  # EXACT REVIEWED VERSION, not a range, for the reason recorded below for nanoid: 0.35.4 is the
  # first version carrying the fix (the advisory states "patched >=0.35.4") and stays on the 0.35
  # line next declares (^0.35.3), so nothing is forced across a semver minor.
  # C15 on #81 (ci 37633376331 at 62ff011, 2026-10-07): sharp <0.35.5 carries GHSA-wq5f-xc86-pv6w (HIGH), published after
  # #80's green run (the lockfile unchanged since). EXACT REVIEWED VERSION: 0.35.5 is the first patched version, on the 0.35
  # line next declares; it carries the same dependencies and the same 25 optional platform packages (their versions moved
  # with it: @img/sharp-* 0.35.5, @img/sharp-libvips-* 1.3.4), so the development closure's component count is unchanged.
  sharp: 0.35.5
  # C15 at 9aaf0311: multer <2.3.0 carries CVE-2026-77037, CVE-2026-77078 and CVE-2026-82333 (HIGH —
  # denial of service via a file-descriptor leak on aborted requests, crafted multipart field names
  # and an oversized array index). Reached transitively through @nestjs/platform-express, which
  # still declares multer 2.2.0 through its 12.0.1 release. EXACT REVIEWED VERSION: 2.3.0 is the
  # first version carrying all three fixes and stays on the 2.x line Nest declares.
  # C15 on #65/#66 (runs 36541560879 / 36541572754, 2026-09-29): multer >=2.2.0 <2.4.0 carries
  # GHSA-3pph-fpjx-jg34 (MODERATE — denial of service via orphaned disk writes on aborted uploads);
  # 2.4.0 is the first patched version, on the same 2.x line (Nest 12.1.1 itself now declares 2.4.0).
  multer: 2.4.0
  postcss: '>=8.5.23'
  # C15 on #80 (ci 37446394135 at baf7a30, 2026-10-06 — advisories published after #80's 2026-10-04 green run; the lockfile unchanged):
  # proxy-addr <2.0.8 carries GHSA-jqcg-44mw-7w3h (CRITICAL — IP spoofing via an IPv4-mapped IPv6 trust subnet), reached through
  # express under @nestjs/platform-express; source-map-js <1.2.2 carries GHSA-68fv-2mgg-jv7q (HIGH — event-loop denial of service
  # through indexed source-map section offsets), reached through postcss (vite, next). EXACT REVIEWED VERSIONS: 2.0.8 and 1.2.2
  # are the first patched versions, on the lines their consumers declare (express ~2.0.7, postcss ^1.x); both carry the same
  # dependencies as the versions they replace, so the development closure (C17's DEVELOPMENT_COMPONENTS) is unchanged.
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  # Gate-2.2 C15/C16: nanoid <3.3.17 is CVE-2026-67213 (HIGH — denial of service via
  # an infinite loop when a custom generator is called with size 0). Reached only
  # through build/test tooling (vite/postcss, next/postcss), but a HIGH advisory in
  # the resolved closure is a HIGH advisory.
  #
  # C16 correction — EXACT REVIEWED VERSION, not a range. A range override is not a
  # reviewed decision: '>=3.3.17' floated the resolution to nanoid@6.0.1, which is
  #   * two majors above what the only consumer declares (postcss@8.5.25 requires
  #     "nanoid": "^3.3.16", so 6.0.1 satisfies NO declared consumer range and was
  #     reachable only because the override forced it), and
  #   * engine-narrowed ("^22 || ^24 || >=26") against our own engines ">=24 <25".
  # Reviewed selection: 3.3.18 — the highest patch on the 3.x line, therefore
  #   * strictly above the <3.3.17 vulnerable boundary (carries the advisory fix),
  #   * inside postcss's declared ^3.3.16 range (no forced semver-major break),
  #   * same public surface postcss actually consumes: main "index.cjs" plus the
  #     "./non-secure" subpath export that postcss/lib/input.js requires, and
  #   * engines "^10 || ^12 || ^13.7 || ^14 || >=15.0.1", which admits node 24.11.1.
  # Verified integrity: sha512-DTg4MJbGMWkfi6VZFdNt2/caMbQy4Ou+Op/hJQvGEWcnVfoA1QA+xzRKAzw9jD6+GVOOeYr/mIcuDSdug6F6+w==
  nanoid: 3.3.18
  # Gate: fast-uri <3.1.6 carries four HIGH advisories published 2026-09-02 —
  # GHSA-jqff-g426-hqxp and GHSA-5jgf-p345-68v8 (host confusion via percent-encoded
  # scheme / skipped IDN canonicalization on scheme-relative references) and
  # GHSA-f65p-4m7j-42xc and GHSA-fph4-wmhf-6fwf (SSRF via malformed IPv6
  # normalization / repeated hostname percent-decoding). Reached only transitively,
  # through ajv, ajv-formats and ajv-formats-draft2019.
  #
  # EXACT REVIEWED VERSION, not a range, for the reason recorded above for nanoid:
  # a range is not a reviewed decision. 3.1.6 is the first version carrying all four
  # fixes (every advisory states "patched >=3.1.6") and stays on the 3.x line ajv
  # declares, so nothing is forced across a semver major.
  # C15 on #65/#66 (runs 36541560879 / 36541572754, 2026-09-29): two further HIGH advisories
  # published 2026-09-28 reach the reviewed 3.1.6 — GHSA-qw65-cvwx-89v3 (<3.1.7: authority
  # injection via an unvalidated port in serialize) and GHSA-58mr-gqgx-xq4g (=3.1.6: host
  # confusion via an unclosed bracket in the authority). 3.1.7 is the first version patched for
  # both (and for the four above) and stays on the 3.x line; the same exact-version rule.
  # C15 on #62's refreshed run (ci 37005512372, 2026-10-02): GHSA-hrr3-gc8f-f4qj (MODERATE) reaches 3.1.7
  # (vulnerable >=3.0.0 <3.1.8); 3.1.8 is the first patched version, on the same 3.x line — the same
  # exact-version rule. The final-manifest assertion accepts only a clean audit receipt.
  fast-uri: 3.1.8
  # Gate: qs <6.16.0 carries two MODERATE advisories published 2026-09-02 —
  # GHSA-4mjr-xmp4-gh2g (denial of service via an attacker-controlled isBuffer) and
  # GHSA-x5fp-wj9c-mxmx (array-limit bypass via bracket-key comma parsing). Reached
  # transitively through @nestjs/platform-express > express > body-parser.
  #
  # The gate requires an EXACTLY clean audit receipt, so a moderate blocks a PASS as
  # surely as a high. Exact reviewed version again, not a range: 6.16.0 is the first
  # version carrying both fixes (both advisories state "patched >=6.16.0") and is the
  # current 6.x release, so express's declared range is satisfied without crossing a
  # semver major.
  qs: 6.16.0

# C17.1 E — TARGET MATERIALIZATION, INDEPENDENT OF THE EXECUTING HOST.
#
# The declared C16 closure targets are linux-x64-glibc. The C17 licence inventory reads declared
# licences and shipped notice files out of MATERIALIZED packages, so a host that never installs
# the target's platform-gated optional packages cannot describe that target — and C17 previously
# failed closed on Darwin for exactly that reason. Declaring the supported architectures here
# makes `pnpm install --frozen-lockfile` materialize the linux-x64-glibc set on every host, so
# the inventory is a function of the lockfile and the target, never of the machine.
#
# `current` is retained alongside so a developer's own platform still works for running the app.
# Neither value becomes closure truth: the C16 closure derives its platform constraints from
# scripts/gate/target-descriptor.json, and C17 asserts the host contributes nothing.
supportedArchitectures:
  os:
    - linux
    - current
  cpu:
    - x64
    - current
  libc:
    - glibc
    - current
