# C19 — CROSS-PLATFORM LIFECYCLE AND CONTAINMENT PROOF.
#
# The containment contract claims the SAME properties on Linux and macOS, so it has to be measured
# on both. `ci` runs on ubuntu only, which means a macOS regression in signal handling, ownership
# tracking or bounded reap would not be caught until the finalizer — long after the decision that
# depended on it.
#
# ── THIS WORKFLOW CANNOT PUBLISH ANYTHING ──
#
# There is no `id-token: write` here, at any level. Without that token no signing identity can be
# minted, so publication is not merely gated in this workflow, it is impossible. That is deliberate:
# the workflow that runs on every pull request should not be one edit away from being able to sign.
name: C19 lifecycle
on:
  pull_request:
  push:
    branches: [main, 'c19-**']

# Read-only, everywhere. No id-token, no contents:write, no packages, no attestations.
permissions:
  contents: read

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The serial suite's coverage runner imports @eye/contracts from its BUILT output, so an
      # install alone leaves it resolving a dist/ that does not exist yet. Caught by CI on both
      # platforms, where 36 controls passed and the runner then failed on ERR_MODULE_NOT_FOUND.
      - run: pnpm build

      - name: Anchor selftest with the network denied
        run: node scripts/gate/c19-anchor-cli.mjs selftest --offline

      - name: Lifecycle and containment controls (signals, races, nesting, reap, cleanup)
        run: pnpm --filter @eye/api exec vitest run --config vitest.c18-serial.config.ts

      - name: Anchor attack matrix
        run: pnpm --filter @eye/api exec vitest run --config vitest.c18.config.ts test/gate/c19-anchor.ctl.ts

      # Both residue checks in one command, in tested source. The shell version of the process
      # check failed on the SUCCESS path: grep and xargs exit non-zero when they match nothing.
      - name: No owned process or docker resource survived
        run: node scripts/gate/c19-anchor-cli.mjs leftovers

      - name: Prove this job holds no publication capability
        shell: bash
        run: |
          set -euo pipefail
          # If an id-token were ever granted here, this fails loudly rather than silently gaining
          # the ability to sign.
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "C19: this workflow must never hold an OIDC token" >&2
            exit 1
          fi
          echo "C19: no OIDC token present — publication is structurally impossible here"

  # ── THE REVERSIBLE HALF OF THE DELIVERY CHAIN, EXERCISED SAFELY ──
  #
  # Default-branch registration is required only for the workflow_run TRIGGER, not for the plumbing
  # itself. Everything up to the irreversible step — resolve, acquire, authenticate the wrapper,
  # verify the inner evidence, build the canonical payload, dry run, verify offline — is reversible
  # and can be proven here, against a real finalizer run that already succeeded on main.
  #
  # This job holds NO id-token at any level, so no OIDC token can be minted and no signature can be
  # produced. It asserts that at runtime rather than relying on the absence being noticed.
  #
  # It runs the SAME source the publish job runs; the plumbing is not duplicated in YAML.
  delivery-chain-dry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history: the harness resolves a fixture commit and needs a worktree at it.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Refuse to continue if this job can sign anything
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::this harness must never hold an OIDC token"
            exit 1
          fi
          echo "no OIDC token present: signing is impossible in this job"

      - name: Resolve a fixture by ATTEMPT, not by the run's current conclusion
        id: fixture
        env:
          GH_TOKEN: ${{ github.token }}
        # Shared source, not YAML logic: a GitHub re-run mutates a run in place, so a filter on the
        # current conclusion cannot see a successful earlier attempt. The resolver walks attempts.
        run: node scripts/gate/c19-fixture.mjs --repo "${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Acquire and authenticate — the SAME code the publish job runs
        if: steps.fixture.outputs.found == 'true'
        id: acquire
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c19
          # The fixture's evidence was produced from ITS OWN commit, not from this PR head. The
          # C17 verifier REGENERATES the source archive from --root and compares, so that root must
          # be the tree the evidence came from AND must have its workspace installed — regeneration
          # imports the workspace's own modules.
          git worktree add --detach /tmp/fixture-src "${{ steps.fixture.outputs.sha }}"
          ( cd /tmp/fixture-src && pnpm install --frozen-lockfile && pnpm build )
          node scripts/gate/c19-acquire.mjs \
            --repo "${{ github.repository }}" \
            --finalizer-run "${{ steps.fixture.outputs.finalizer_run }}" \
            --source-run "${{ steps.fixture.outputs.source_run }}" \
            --source-attempt "${{ steps.fixture.outputs.source_attempt }}" \
            --source-root /tmp/fixture-src \
            --out /tmp/c19 >> "$GITHUB_OUTPUT"

      - name: Build the canonical payload — the SAME code the publish job runs
        if: steps.fixture.outputs.found == 'true'
        env:
          SOURCE_SHA: ${{ steps.fixture.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.fixture.outputs.source_run }}
          SOURCE_RUN_ATTEMPT: ${{ steps.fixture.outputs.source_attempt }}
          SOURCE_EVENT: ${{ steps.fixture.outputs.source_event }}
          FINALIZER_RUN_ID: ${{ steps.fixture.outputs.finalizer_run }}
          FINALIZER_RUN_ATTEMPT: ${{ steps.fixture.outputs.finalizer_attempt }}
          FINALIZER_COMPLETED_AT: ${{ steps.fixture.outputs.finalizer_completed_at }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.acquire.outputs.artifact_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ steps.acquire.outputs.artifact_name }}
          EVIDENCE_DIGEST: ${{ steps.acquire.outputs.wrapper_digest }}
          FINALIZED_INNER_NAME: ${{ steps.acquire.outputs.inner_name }}
          FINALIZED_INNER_DIGEST: ${{ steps.acquire.outputs.inner_digest }}
        run: |
          set -euo pipefail
          export SOURCE_TREE="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          export WORKFLOW_DIGEST="$(sha256sum .github/workflows/c19-anchor.yml | cut -d' ' -f1)"
          node scripts/gate/c19-anchor-cli.mjs payload --out /tmp/c19/payload.json
          # Determinism is the property recovery depends on: the same publication identity must
          # produce byte-identical bytes, or a retry can never find its own prior entry.
          node scripts/gate/c19-anchor-cli.mjs payload --out /tmp/c19/payload2.json
          cmp /tmp/c19/payload.json /tmp/c19/payload2.json \
            || { echo "::error::the payload is not deterministic across invocations"; exit 1; }
          echo "payload is byte-identical across two invocations"

      - name: Publication DRY RUN — must reach no irreversible step
        if: steps.fixture.outputs.found == 'true'
        env:
          SOURCE_SHA: ${{ steps.fixture.outputs.sha }}
          RUN_URI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node scripts/gate/c19-anchor-cli.mjs publish --dry-run \
            --artifact /tmp/c19/finalized.zip \
            --payload  /tmp/c19/payload.json \
            --bundle   /tmp/c19/payload.sigstore.json 2>&1 | tee /tmp/c19/dry.log
          grep -q "DRY RUN" /tmp/c19/dry.log
          # Nothing may have been signed or persisted.
          [ ! -f /tmp/c19/payload.sigstore.json ] || { echo "::error::a dry run produced a bundle"; exit 1; }

      - name: Prove zero signing and zero Rekor writes occurred
        if: steps.fixture.outputs.found == 'true'
        run: |
          set -euo pipefail
          # No bundle, no signature, and cosign was never installed in this job.
          [ ! -f /tmp/c19/payload.sigstore.json ] || { echo "::error::a bundle exists"; exit 1; }
          ! command -v cosign >/dev/null 2>&1 || { echo "::error::cosign is present in a non-publishing job"; exit 1; }
          echo "zero signing attempts, zero Rekor writes, no bundle produced"

      - name: Persist the dry-run evidence for review
        if: steps.fixture.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c19-delivery-chain-dry-run
          path: |
            /tmp/c19/payload.json
            /tmp/c19/dry.log
          if-no-files-found: error
