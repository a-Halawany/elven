# The Eye — CI (ADR-P0-16: supply-chain baseline is Phase 0 scope, not deferred)
#
# Infrastructure comes up via docker-compose.yml, so CI exercises the SAME digest-pinned
# images and the SAME loopback + Redis-auth profile as local runs. Every secret is
# generated per run — no fixed reusable credentials anywhere in the pipeline.
#
# ── C16-R2 CORRECTIONS (hosted run 31532067899 was RED) ───────────────────────────
#  * supply-chain failed during C15: CI prefetched only the trivy vulnerability DB while
#    the runner requires a misconfiguration CHECKS-BUNDLE digest before the first scan.
#    trivy 0.73 has no --download-check-only; the bundle is fetched lazily by the first
#    misconfig scan. The tracked runner now acquires BOTH artifacts into one explicit
#    isolated cache, enforces their provenance, and runs every authoritative scan with
#    updates disabled — proving the cache is unchanged afterwards.
#  * browser-regression failed with `password authentication failed for user
#    "eye_publisher"`: the job never ran `pnpm db:migrate`, so the least-privilege roles
#    were never created with the ephemeral run passwords. Pre-existing since the original
#    monorepo scaffold — no hosted run in this repository had ever been green.
#  * Every action is pinned to an immutable commit SHA. Every scanner download is
#    authenticated against the tracked upstream checksums in scripts/gate/scanner-pins.json.
#  * Node is pinned to exactly 24.11.1, not a floating major.
#  * The legacy Gate-2.1 SBOM generator is removed from the active gate: its
#    "bidirectional" reconciliation compared two structures derived from the same
#    generated SBOM, so it could not fail. Superseded by the C16 runner.
#  * Container dispositions are machine-governed and target-specific
#    (scripts/gate/scanner-exclusions.json); the bare global .trivyignore is gone,
#    because a bare CVE id suppresses that advisory in EVERY image and package.
#  * Gate artifacts go to explicit per-run temporary directories and are uploaded even on
#    failure, so a red run stays auditable. No step and no test reads a gitignored path.
#
# Jobs: 3 (build-test, browser-regression, supply-chain).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # C16-R3.4 §7: a transient upstream failure (a 404 from the trivy checks-bundle mirror has
  # reddened three runs) must be rerunnable WITHOUT touching source. Empty retry-only commits
  # pollute the candidate history and change the SHA the evidence is bound to.
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.11.1
  PNPM_VERSION: 11.9.0
  GITLEAKS_VERSION: 8.30.1
  TRIVY_VERSION: 0.73.0

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.11.1, cache: pnpm }
      # C16-R3.4 SECURITY CORRECTION. These values were previously appended straight to
      # $GITHUB_ENV, and the runner echoes an `env:` group before every `run:` step — so all
      # thirteen appeared in PLAINTEXT in the public log, once per subsequent step. The
      # tracked helper emits `::add-mask::` for each value BEFORE exporting it, so the runner
      # redacts it everywhere thereafter. One script, used by both database jobs.
      - name: Generate, MASK and export ephemeral run secrets (R7 — no fixed credentials)
        run: bash scripts/ci/generate-run-secrets.sh
      - name: Compose up (digest-pinned postgres/redis, loopback, redis auth)
        run: docker compose up -d --wait
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Module boundaries (dependency-cruiser, blocking)
        run: pnpm boundaries
      # Gate-2 §10: typecheck runs BEFORE build and must pass from a genuinely clean
      # checkout. Workspace packages expose their sources through the "development"
      # export condition, so no pre-built dist is required. This step also asserts that
      # no stale dist/.next/tsbuildinfo is present.
      - name: Clean-source typecheck + build (blocking, real CI order)
        run: bash scripts/verify-clean-typecheck.sh
      # The licence inventory is a declared precondition of the G21-21 artifact gate. The
      # Gate-2.1 SBOM generator is deliberately NOT run — see the header.
      - name: Supply-chain gate input (licence inventory, blocking)
        run: node scripts/license-inventory.mjs
      # C16 closure gate, BLOCKING, into an explicit per-run temporary directory so no
      # step and no test depends on gitignored state.
      - name: C16 target-resolved closure gate (tracked runner, blocking)
        run: |
          set -euo pipefail
          C16_OUT="$(mktemp -d)"
          echo "C16_OUT=$C16_OUT" >> "$GITHUB_ENV"
          node scripts/gate/generate-closures.mjs --out "$C16_OUT"
          test -s "$C16_OUT/closure-reconciliation.json"
          test -s "$C16_OUT/sbom-linux-x64-glibc-prod.cdx.json"
          test -s "$C16_OUT/sbom-linux-x64-glibc-dev.cdx.json"
      - name: Unit + conformance + gate tests (hermetic — no network)
        timeout-minutes: 20
        run: pnpm test
      - name: Migrations + acceptance suite (15 criteria + request paths + R4/R10)
        # Acceptance runs BEFORE integration: the acceptance beforeAll relies on the
        # one-shot bootstrap creating the reserved `platform-admin`; the integration
        # suites intentionally create additional platform_admin principals, which would
        # make the (correct) one-shot bootstrap refuse.
        env:
          EYE_DB_HOST: localhost
          EYE_DB_MIGRATE_PASSWORD: ${{ env.EYE_DB_PASSWORD }}
        run: |
          pnpm db:migrate
          pnpm --filter @eye/api test:accept
      - name: Integration tests (isolation, privileges, audit concurrency, refresh)
        env:
          EYE_DB_HOST: localhost
          EYE_DB_MIGRATE_PASSWORD: ${{ env.EYE_DB_PASSWORD }}
        run: pnpm --filter @eye/api test:int
      - name: Upload C16 gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c16-closure-evidence
          path: ${{ env.C16_OUT }}
          if-no-files-found: warn

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.11.1, cache: pnpm }
      # C16-R3.4 SECURITY CORRECTION. These values were previously appended straight to
      # $GITHUB_ENV, and the runner echoes an `env:` group before every `run:` step — so all
      # thirteen appeared in PLAINTEXT in the public log, once per subsequent step. The
      # tracked helper emits `::add-mask::` for each value BEFORE exporting it, so the runner
      # redacts it everywhere thereafter. One script, used by both database jobs.
      - name: Generate, MASK and export ephemeral run secrets (R7 — no fixed credentials)
        run: bash scripts/ci/generate-run-secrets.sh
      - name: Compose up (digest-pinned postgres/redis, loopback, redis auth)
        run: docker compose up -d --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # C16-R2: THE MISSING STEP. Without it the least-privilege roles never exist with
      # this run's ephemeral passwords, and the API's outbox publisher dies with
      # `password authentication failed for user "eye_publisher"` before the first
      # scenario can run. Pre-existing defect since the original monorepo scaffold.
      - name: Migrate the database (creates the least-privilege roles for this run)
        env:
          EYE_DB_HOST: localhost
          EYE_DB_MIGRATE_PASSWORD: ${{ env.EYE_DB_PASSWORD }}
        run: pnpm db:migrate
      - name: Install Chrome (stable channel)
        run: pnpm exec playwright install chrome
      - name: Phase 0 browser regression gate (10 scenarios, blocking)
        env:
          EYE_DB_HOST: localhost
          EYE_DB_MIGRATE_PASSWORD: ${{ env.EYE_DB_PASSWORD }}
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: playwright-traces, path: test-results/, if-no-files-found: warn }

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.11.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Downloads are AUTHENTICATED against the tracked upstream checksums in
      # scripts/gate/scanner-pins.json. An unauthenticated download is an unverified input
      # to the gate that exists to verify inputs.
      # timeout-minutes is the BACKSTOP for the script's own absolute acquisition deadline
      # (EYE_SCANNER_ACQUIRE_DEADLINE_SECONDS, 600s per tool). It bounds the step even if the
      # script is bypassed or edited; the two are deliberately independent.
      - name: Install PINNED scanner binaries (archive AND executable digests verified)
        timeout-minutes: 25
        run: bash scripts/gate/install-scanners.sh gitleaks trivy
      - name: Verify scanner + toolchain versions are EXACTLY the pinned ones
        run: |
          set -euo pipefail
          check() { [ "$2" = "$3" ] || { echo "::error::$1: got '$2', want '$3'"; exit 1; }; echo "$1 = $2"; }
          check node     "$(node --version)"   "v${NODE_VERSION}"
          check pnpm     "$(pnpm --version)"   "${PNPM_VERSION}"
          check gitleaks "$(gitleaks version)" "${GITLEAKS_VERSION}"
          check trivy    "$(trivy --version | sed -n 's/^Version: *//p' | head -1)" "${TRIVY_VERSION}"
      - name: Pinned-digest consistency (compose == conformance manifest)
        run: |
          set -euo pipefail
          PG_DIGEST=$(python3 -c "import json;print(json.load(open('conformance.manifest.json'))['pinned_images']['postgres']['digest'])")
          REDIS_DIGEST=$(python3 -c "import json;print(json.load(open('conformance.manifest.json'))['pinned_images']['redis']['digest'])")
          grep -qF "image: $PG_DIGEST" docker-compose.yml || { echo "::error::compose postgres digest != manifest"; exit 1; }
          grep -qF "image: $REDIS_DIGEST" docker-compose.yml || { echo "::error::compose redis digest != manifest"; exit 1; }
      # BLOCKING. The runner acquires the vulnerability DB *and* the checks bundle into the
      # isolated cache below, captures and enforces their provenance, then runs every
      # authoritative scan with --skip-db-update --skip-check-update and proves the cache
      # fingerprint is unchanged. 8 steps, 6 blocking; the 2 non-blocking steps are
      # alternate output FORMATS with byte-identical coverage descriptors.
      # FINAL MODE, bound to the Actions head SHA. Final mode requires an explicit expected
      # SHA, HEAD equal to it, a real git worktree and a clean tree — so the uploaded
      # manifests state `final` and carry the exact commit this run describes.
      - name: C15 supply-chain gate (tracked pinned runner, FINAL, blocking)
        run: |
          set -euo pipefail
          C15_OUT="$(mktemp -d)"
          C15_CACHE="$(mktemp -d)"
          echo "C15_OUT=$C15_OUT" >> "$GITHUB_ENV"
          echo "C15_CACHE=$C15_CACHE" >> "$GITHUB_ENV"
          node scripts/gate/supply-chain.mjs \
            --out "$C15_OUT" \
            --trivy-cache "$C15_CACHE" \
            --final \
            --expected-sha "$GITHUB_SHA"
      - name: C16 target-resolved closure gate (tracked runner, FINAL, blocking)
        run: |
          set -euo pipefail
          C16_OUT="$(mktemp -d)"
          echo "C16_OUT=$C16_OUT" >> "$GITHUB_ENV"
          node scripts/gate/generate-closures.mjs \
            --out "$C16_OUT" \
            --final \
            --expected-sha "$GITHUB_SHA"
      - name: Assert the manifests state FINAL mode and the exact Actions head SHA
        run: node scripts/gate/assert-final-manifests.mjs "$C15_OUT" "$C16_OUT" "$GITHUB_SHA"
      - name: License inventory (allowlist-checked over PRODUCTION AND DEVELOPMENT, blocking)
        run: node scripts/license-inventory.mjs
      # Package the final evidence as ONE inspectable ZIP with its own SHA-256, so an
      # unsigned public reviewer can download it and verify the bytes they received.
      - name: Package final C15 + C16 evidence as an inspectable ZIP
        if: always()
        # The packaging logic lives in the tracked `scripts/gate/package-evidence.sh` so a
        # behavioural control can execute it. Inline runner shell cannot be tested, and the
        # self-referential-manifest defect it now guards against was invisible to any
        # assertion made by reading this file.
        run: |
          set -euo pipefail
          DEST="$(mktemp -d)"
          OUT="$(bash scripts/gate/package-evidence.sh \
                   "${C15_OUT:-/nonexistent}" "${C16_OUT:-/nonexistent}" "$GITHUB_SHA" "$DEST")"
          ZIP="$(printf '%s\n' "$OUT" | sed -n 1p)"
          DIGEST="$(printf '%s\n' "$OUT" | sed -n 2p)"
          echo "EVIDENCE_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "EVIDENCE_ZIP_SHA256=$DIGEST" >> "$GITHUB_ENV"
          # Independently re-verify the published bytes: unpack the ZIP that will actually
          # be uploaded and check its manifest, so the digest in the summary describes an
          # archive a reviewer can verify rather than one that merely got written.
          CHECK="$(mktemp -d)"
          ( cd "$CHECK" && unzip -q "$ZIP" && sha256sum -c --quiet SHA256SUMS.txt )
          {
            echo "### C16-R3.4 final evidence package"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| source SHA | \`${GITHUB_SHA}\` |"
            echo "| ZIP name | \`$(basename "$ZIP")\` |"
            echo "| ZIP SHA-256 | \`${DIGEST}\` |"
            echo "| files | $(find "$CHECK" -type f | wc -l | tr -d ' ') |"
            echo "| manifest | \`sha256sum -c SHA256SUMS.txt\` verified after unpacking |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "evidence ZIP sha256: $DIGEST"
      # ALWAYS upload: a red run must remain auditable. The runner writes a failure
      # manifest and RESULT-FAIL.txt before exiting, so these paths exist either way.
      - name: Upload C15 + C16 raw gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-gate-evidence
          path: |
            ${{ env.C15_OUT }}
            ${{ env.C16_OUT }}
          if-no-files-found: warn
      - name: Upload the inspectable final-evidence ZIP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c16-r34-final-evidence-zip
          path: ${{ env.EVIDENCE_ZIP }}
          if-no-files-found: warn
