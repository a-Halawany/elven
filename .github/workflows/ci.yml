# The Eye — CI (ADR-P0-16: supply-chain baseline is Phase 0 scope, not deferred)
#
# Infrastructure comes up via docker-compose.yml, so CI exercises the SAME digest-pinned
# images and the SAME loopback + Redis-auth profile as local runs. Every secret is
# generated per run — no fixed reusable credentials anywhere in the pipeline.
#
# ── C16-R2 CORRECTIONS (hosted run 31532067899 was RED) ───────────────────────────
#  * supply-chain failed during C15: CI prefetched only the trivy vulnerability DB while
#    the runner requires a misconfiguration CHECKS-BUNDLE digest before the first scan.
#    trivy 0.73 has no --download-check-only; the bundle is fetched lazily by the first
#    misconfig scan. The tracked runner now acquires BOTH artifacts into one explicit
#    isolated cache, enforces their provenance, and runs every authoritative scan with
#    updates disabled — proving the cache is unchanged afterwards.
#  * browser-regression failed with `password authentication failed for user
#    "eye_publisher"`: the job never ran `pnpm db:migrate`, so the least-privilege roles
#    were never created with the ephemeral run passwords. Pre-existing since the original
#    monorepo scaffold — no hosted run in this repository had ever been green.
#  * Every action is pinned to an immutable commit SHA. Every scanner download is
#    authenticated against the tracked upstream checksums in scripts/gate/scanner-pins.json.
#  * Node is pinned to exactly 24.11.1, not a floating major.
#  * The legacy Gate-2.1 SBOM generator is removed from the active gate: its
#    "bidirectional" reconciliation compared two structures derived from the same
#    generated SBOM, so it could not fail. Superseded by the C16 runner.
#  * Container dispositions are machine-governed and target-specific
#    (scripts/gate/scanner-exclusions.json); the bare global .trivyignore is gone,
#    because a bare CVE id suppresses that advisory in EVERY image and package.
#  * Gate artifacts go to explicit per-run temporary directories and are uploaded even on
#    failure, so a red run stays auditable. No step and no test reads a gitignored path.
#
# Jobs: 3 (build-test, browser-regression, supply-chain).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # ── RECOVERY CONTRACT (corrected at C17.2) ──────────────────────────────────────
  # A transient upstream failure — a 404 from the trivy checks-bundle mirror, or a timeout from
  # GitHub's own ArtifactService, both of which have reddened runs here — must be recoverable
  # WITHOUT touching source. Empty retry-only commits pollute candidate history and change the SHA
  # the evidence is bound to.
  #
  # But the two recovery routes are NOT interchangeable, and conflating them produced a run that
  # could never be verified:
  #
  #   * `workflow_dispatch` is CANDIDATE PREFLIGHT ONLY. Its receipt carries
  #     event=workflow_dispatch on a branch ref, which delivery verification rejects by design. Use
  #     it to gate a fast-forward; never offer its archive as final evidence.
  #   * An EVIDENCE-BEARING run is a `push` on `main`. If one fails, re-run the ENTIRE workflow,
  #     never only the failed jobs: the verifier requires build-test, supply-chain and
  #     browser-regression to have all succeeded in the SAME attempt, and a partial re-run leaves
  #     the other two jobs recorded against the previous attempt.
  #
  # Artifact names are attempt-scoped for exactly this reason — see the upload steps.
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.11.1
  PNPM_VERSION: 11.9.0
  GITLEAKS_VERSION: 8.30.1
  TRIVY_VERSION: 0.73.0

jobs:
  build-test:
    # C17.2 — an explicit JOB bound. No job had one; a hung step could only be stopped
    # by the 6-hour platform default, which is not a bound anyone reviews.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.11.1, cache: pnpm }
      # C16-R3.4 SECURITY CORRECTION. These values were previously appended straight to
      # $GITHUB_ENV, and the runner echoes an `env:` group before every `run:` step — so all
      # thirteen appeared in PLAINTEXT in the public log, once per subsequent step. The
      # tracked helper emits `::add-mask::` for each value BEFORE exporting it, so the runner
      # redacts it everywhere thereafter. One script, used by both database jobs.
      - name: Generate, MASK and export ephemeral run secrets (R7 — no fixed credentials)
        run: bash scripts/ci/generate-run-secrets.sh
      - name: Compose up (digest-pinned postgres/redis, loopback, redis auth)
        run: docker compose up -d --wait
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Module boundaries (dependency-cruiser, blocking)
        run: pnpm boundaries
      # Gate-2 §10: typecheck runs BEFORE build and must pass from a genuinely clean
      # checkout. Workspace packages expose their sources through the "development"
      # export condition, so no pre-built dist is required. This step also asserts that
      # no stale dist/.next/tsbuildinfo is present.
      - name: Clean-source typecheck + build (blocking, real CI order)
        run: bash scripts/verify-clean-typecheck.sh
      # The licence inventory is a declared precondition of the G21-21 artifact gate. The
      # Gate-2.1 SBOM generator is deliberately NOT run — see the header.
      - name: Supply-chain gate input (licence inventory, blocking)
        run: node scripts/license-inventory.mjs
      # C16 closure gate, BLOCKING, into an explicit per-run temporary directory so no
      # step and no test depends on gitignored state.
      - name: C16 target-resolved closure gate (tracked runner, blocking)
        # C17.2 — a DETERMINISTIC path under the runner's temp root, not mktemp. The upload
        # below runs always(), and an `${{ env.* }}` path is EMPTY when this step never ran;
        # `if-no-files-found: warn` does not protect against an empty path input.
        run: |
          set -euo pipefail
          C16_OUT="$RUNNER_TEMP/c16-out"
          mkdir -p "$C16_OUT"
          echo "C16_OUT=$C16_OUT" >> "$GITHUB_ENV"
          node scripts/gate/generate-closures.mjs --out "$C16_OUT"
          test -s "$C16_OUT/closure-reconciliation.json"
          test -s "$C16_OUT/sbom-linux-x64-glibc-prod.cdx.json"
          test -s "$C16_OUT/sbom-linux-x64-glibc-dev.cdx.json"
      - name: Unit + conformance + gate tests (hermetic — no network)
        timeout-minutes: 20
        run: pnpm test
      - name: Migrations + acceptance suite (15 criteria + request paths + R4/R10)
        # Acceptance runs BEFORE integration: the acceptance beforeAll relies on the
        # one-shot bootstrap creating the reserved `platform-admin`; the integration
        # suites intentionally create additional platform_admin principals, which would
        # make the (correct) one-shot bootstrap refuse.
        env:
          EYE_DB_HOST: localhost
          EYE_DB_MIGRATE_PASSWORD: ${{ env.EYE_DB_PASSWORD }}
        run: |
          pnpm db:migrate
          pnpm --filter @eye/api test:accept
      - name: Integration tests (isolation, privileges, audit concurrency, refresh)
        env:
          EYE_DB_HOST: localhost
          EYE_DB_MIGRATE_PASSWORD: ${{ env.EYE_DB_PASSWORD }}
        run: pnpm --filter @eye/api test:int
      # C18 — BLOCKING dual-path database history proof. The tracked runner provisions two
      # fully isolated postgres+redis instances with per-run names, ports and credentials
      # (never the compose stack, never shared between paths), applies 0001-0012, seeds only
      # through the historically valid governed ports, upgrades with the unchanged 0013-0021,
      # proves preservation + intentional transformation + posture equivalence against the
      # code-owned contract, runs the suite matrix on both paths, and self-verifies the
      # checksummed evidence archive it packaged.
      - name: C18 dual-path database history gate (tracked runner, blocking)
        id: c18_gate
        timeout-minutes: 25
        run: |
          set -euo pipefail
          # The clean-typecheck step above regenerates the TRACKED evidence/clean-typecheck.txt
          # with a fresh timestamp (its bytes are committed only in evidence-attestation child
          # commits, never from CI). C18's final mode requires the tree to EQUAL the SHA under
          # test, so restore that ONE file to its committed bytes — and fail loudly if anything
          # else is dirty, because any other modification is a real problem this step must not
          # paper over.
          DIRTY="$(git status --porcelain)"
          if [ -n "$DIRTY" ] && [ "$DIRTY" != " M evidence/clean-typecheck.txt" ]; then
            echo "::error::unexpected dirty worktree before the C18 gate:"; git status --porcelain; exit 1
          fi
          git restore evidence/clean-typecheck.txt 2>/dev/null || true
          C18_OUT="$RUNNER_TEMP/c18-out"
          # THE WHOLE GATE RUNS UNDER THE WATCHDOG. The four stages — production, offline
          # self-verification, the parallel mutation/differential shards and the serial lifecycle
          # controls — are one command (scripts/gate/c18-gate.mjs), so the 900-second bound covers
          # the gate rather than one command inside it. Invoking the stages separately here is what
          # made the "900-second watchdog" claim untrue for as long as it was made. The job-level
          # timeout-minutes above remains as an outer defence.
          node scripts/gate/c18-watchdog.mjs 900 \
            node scripts/gate/c18-gate.mjs --out "$C18_OUT" \
            --final --expected-sha "$GITHUB_SHA"
          C18_ZIP="$(ls "$C18_OUT"/c18-db-paths-evidence-*.zip)"
          # The digest-bound artifact carries EXACTLY the archive and its sidecar.
          mkdir -p "$RUNNER_TEMP/c18-artifact"
          cp "$C18_ZIP" "$C18_ZIP.sha256" "$RUNNER_TEMP/c18-artifact/"
      # The DELIVERY artifact: digest-bound name (the verifier's online hosted standing checks
      # this exact name), guarded on the producing gate.
      - name: Upload the C18 evidence archive
        if: always() && steps.c18_gate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c18-db-paths-evidence-a${{ github.run_attempt }}-${{ env.C18_ZIP_SHA256 }}
          path: ${{ runner.temp }}/c18-artifact
          if-no-files-found: error
      # DIAGNOSTIC-grade upload: always(), so a red C18 run's failure evidence (RESULT-FAIL,
      # commands.json, raw outputs) survives. No digest in the name; static runner-temp path.
      - name: Upload C18 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c18-diagnostics-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/c18-out
          if-no-files-found: warn
      - name: Upload C16 gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c16-closure-evidence-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/c16-out
          if-no-files-found: warn

  browser-regression:
    # C17.2 — an explicit JOB bound. No job had one; a hung step could only be stopped
    # by the 6-hour platform default, which is not a bound anyone reviews.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.11.1, cache: pnpm }
      # C16-R3.4 SECURITY CORRECTION. These values were previously appended straight to
      # $GITHUB_ENV, and the runner echoes an `env:` group before every `run:` step — so all
      # thirteen appeared in PLAINTEXT in the public log, once per subsequent step. The
      # tracked helper emits `::add-mask::` for each value BEFORE exporting it, so the runner
      # redacts it everywhere thereafter. One script, used by both database jobs.
      - name: Generate, MASK and export ephemeral run secrets (R7 — no fixed credentials)
        run: bash scripts/ci/generate-run-secrets.sh
      - name: Compose up (digest-pinned postgres/redis, loopback, redis auth)
        run: docker compose up -d --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # C16-R2: THE MISSING STEP. Without it the least-privilege roles never exist with
      # this run's ephemeral passwords, and the API's outbox publisher dies with
      # `password authentication failed for user "eye_publisher"` before the first
      # scenario can run. Pre-existing defect since the original monorepo scaffold.
      - name: Migrate the database (creates the least-privilege roles for this run)
        env:
          EYE_DB_HOST: localhost
          EYE_DB_MIGRATE_PASSWORD: ${{ env.EYE_DB_PASSWORD }}
        run: pnpm db:migrate
      - name: Install Chrome (stable channel)
        run: pnpm exec playwright install chrome
      - name: Phase 0 browser regression gate (10 scenarios, blocking)
        env:
          EYE_DB_HOST: localhost
          EYE_DB_MIGRATE_PASSWORD: ${{ env.EYE_DB_PASSWORD }}
        # C17.2 — failure evidence goes to a DETERMINISTIC directory under the runner temp
        # root, the same contract as every other upload path in this pipeline.
        run: pnpm exec playwright test --output="$RUNNER_TEMP/playwright-traces"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-traces-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/playwright-traces
          if-no-files-found: warn

  supply-chain:
    # C17.2 — an explicit JOB bound. No job had one; a hung step could only be stopped
    # by the 6-hour platform default, which is not a bound anyone reviews. This job runs
    # four gates plus scanner acquisition, packaging and full offline self-verification
    # (which regenerates C16 + C17 from source), so its bound is deliberately the widest.
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.11.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Downloads are AUTHENTICATED against the tracked upstream checksums in
      # scripts/gate/scanner-pins.json. An unauthenticated download is an unverified input
      # to the gate that exists to verify inputs.
      # timeout-minutes is the BACKSTOP for the script's own absolute acquisition deadline
      # (EYE_SCANNER_ACQUIRE_DEADLINE_SECONDS, 600s per tool). It bounds the step even if the
      # script is bypassed or edited; the two are deliberately independent.
      - name: Install PINNED scanner binaries (archive AND executable digests verified)
        timeout-minutes: 25
        run: bash scripts/gate/install-scanners.sh gitleaks trivy
      - name: Verify scanner + toolchain versions are EXACTLY the pinned ones
        run: |
          set -euo pipefail
          check() { [ "$2" = "$3" ] || { echo "::error::$1: got '$2', want '$3'"; exit 1; }; echo "$1 = $2"; }
          check node     "$(node --version)"   "v${NODE_VERSION}"
          check pnpm     "$(pnpm --version)"   "${PNPM_VERSION}"
          check gitleaks "$(gitleaks version)" "${GITLEAKS_VERSION}"
          check trivy    "$(trivy --version | sed -n 's/^Version: *//p' | head -1)" "${TRIVY_VERSION}"
      - name: Pinned-digest consistency (compose == conformance manifest)
        run: |
          set -euo pipefail
          PG_DIGEST=$(python3 -c "import json;print(json.load(open('conformance.manifest.json'))['pinned_images']['postgres']['digest'])")
          REDIS_DIGEST=$(python3 -c "import json;print(json.load(open('conformance.manifest.json'))['pinned_images']['redis']['digest'])")
          grep -qF "image: $PG_DIGEST" docker-compose.yml || { echo "::error::compose postgres digest != manifest"; exit 1; }
          grep -qF "image: $REDIS_DIGEST" docker-compose.yml || { echo "::error::compose redis digest != manifest"; exit 1; }
      # BLOCKING. The runner acquires the vulnerability DB *and* the checks bundle into the
      # isolated cache below, captures and enforces their provenance, then runs every
      # authoritative scan with --skip-db-update --skip-check-update and proves the cache
      # fingerprint is unchanged. 8 steps, 6 blocking; the 2 non-blocking steps are
      # alternate output FORMATS with byte-identical coverage descriptors.
      # FINAL MODE, bound to the Actions head SHA. Final mode requires an explicit expected
      # SHA, HEAD equal to it, a real git worktree and a clean tree — so the uploaded
      # manifests state `final` and carry the exact commit this run describes.
      # C17.2 — every gate output lives at a DETERMINISTIC path under the runner's temp root.
      # The diagnostic uploads below run always(), and an `${{ env.* }}` path is EMPTY when the
      # producing step never ran; `if-no-files-found: warn` does not protect against an empty
      # path input, it only tolerates a nonempty path that matched nothing.
      - name: C15 supply-chain gate (tracked pinned runner, FINAL, blocking)
        run: |
          set -euo pipefail
          C15_OUT="$RUNNER_TEMP/c15-out"
          C15_CACHE="$RUNNER_TEMP/c15-cache"
          mkdir -p "$C15_OUT" "$C15_CACHE"
          echo "C15_OUT=$C15_OUT" >> "$GITHUB_ENV"
          echo "C15_CACHE=$C15_CACHE" >> "$GITHUB_ENV"
          node scripts/gate/supply-chain.mjs \
            --out "$C15_OUT" \
            --trivy-cache "$C15_CACHE" \
            --final \
            --expected-sha "$GITHUB_SHA"
      - name: C16 target-resolved closure gate (tracked runner, FINAL, blocking)
        run: |
          set -euo pipefail
          C16_OUT="$RUNNER_TEMP/c16-out"
          mkdir -p "$C16_OUT"
          echo "C16_OUT=$C16_OUT" >> "$GITHUB_ENV"
          node scripts/gate/generate-closures.mjs \
            --out "$C16_OUT" \
            --final \
            --expected-sha "$GITHUB_SHA"
      - name: Assert the manifests state FINAL mode and the exact Actions head SHA
        run: node scripts/gate/assert-final-manifests.mjs "$C15_OUT" "$C16_OUT" "$GITHUB_SHA"
      - name: License inventory (allowlist-checked over PRODUCTION AND DEVELOPMENT, blocking)
        run: node scripts/license-inventory.mjs
      # C17. Official CycloneDX 1.6 validation against the VENDORED schema closure plus the
      # target-specific licence inventory, obligations and notices. Entirely offline: the
      # schema is verified byte-for-byte before compilation and nothing is downloaded. Any
      # generation, compilation, validation, reconciliation, governance or write failure
      # exits nonzero and fails the job.
      - name: C17 official CycloneDX validation + licence obligations (blocking)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          C17_OUT="$RUNNER_TEMP/c17-out"
          mkdir -p "$C17_OUT"
          echo "C17_OUT=$C17_OUT" >> "$GITHUB_ENV"
          node scripts/gate/licence-obligations.mjs \
            --out "$C17_OUT" \
            --final \
            --expected-sha "$GITHUB_SHA"
      # Package the final evidence as ONE inspectable ZIP with its own SHA-256, so an
      # unsigned public reviewer can download it and verify the bytes they received.
      - name: Package final C15 + C16 evidence as an inspectable ZIP
        id: evidence_zip
        if: always()
        # The packaging logic lives in the tracked `scripts/gate/package-evidence.sh` so a
        # behavioural control can execute it. Inline runner shell cannot be tested, and the
        # self-referential-manifest defect it now guards against was invisible to any
        # assertion made by reading this file.
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/final-evidence"
          mkdir -p "$DEST"
          OUT="$(bash scripts/gate/package-evidence.sh \
                   "${C15_OUT:-/nonexistent}" "${C16_OUT:-/nonexistent}" "$GITHUB_SHA" "$DEST")"
          ZIP="$(printf '%s\n' "$OUT" | sed -n 1p)"
          DIGEST="$(printf '%s\n' "$OUT" | sed -n 2p)"
          echo "EVIDENCE_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "EVIDENCE_ZIP_SHA256=$DIGEST" >> "$GITHUB_ENV"
          # Independently re-verify the published bytes: unpack the ZIP that will actually
          # be uploaded and check its manifest, so the digest in the summary describes an
          # archive a reviewer can verify rather than one that merely got written.
          CHECK="$(mktemp -d)"
          ( cd "$CHECK" && unzip -q "$ZIP" && sha256sum -c --quiet SHA256SUMS.txt )
          {
            echo "### C16-R3.4 final evidence package"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| source SHA | \`${GITHUB_SHA}\` |"
            echo "| ZIP name | \`$(basename "$ZIP")\` |"
            echo "| ZIP SHA-256 | \`${DIGEST}\` |"
            echo "| files | $(find "$CHECK" -type f | wc -l | tr -d ' ') |"
            echo "| manifest | \`sha256sum -c SHA256SUMS.txt\` verified after unpacking |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "evidence ZIP sha256: $DIGEST"
      # ALWAYS upload: a red run must remain auditable. The runner writes a failure
      # manifest and RESULT-FAIL.txt before exiting, so these paths exist either way.
      # C17.2 — the BLOCKING packager runs BEFORE every artifact upload. It used to sit after
      # the raw-evidence upload, so when GitHub's artifact service timed out the packager was
      # SKIPPED and the job reported failure without ever having run the check that matters.
      # An auxiliary upload outage must not be able to skip a blocking gate.
      #
      # DELIBERATELY SKIPPED on pull_request: a PR run still executes every C15–C17 gate above,
      # but its receipt is neither a candidate dispatch nor a push/main delivery, so no release
      # archive is packaged or uploaded from it. On the two real events the caller-owned receipt
      # profile is stated explicitly: a branch dispatch is a CANDIDATE preflight, a push on main
      # is DELIVERY evidence. Offline self-verification here checks structure, code-owned
      # identity and the head_sha binding; it never contacts the API.
      - name: Package + verify the C17 evidence archive (tracked packager, blocking)
        id: c17_package
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          C17_PKG="$RUNNER_TEMP/c17-pkg"
          mkdir -p "$C17_PKG"
          echo "C17_PKG=$C17_PKG" >> "$GITHUB_ENV"
          node scripts/gate/package-c17-evidence.mjs pack \
            --c16 "$C16_OUT" --c17 "$C17_OUT" --out "$C17_PKG" --require-final
          node scripts/gate/package-c17-evidence.mjs verify \
            --zip "$(ls "$C17_PKG"/c17-evidence-*.zip)" --root "$PWD" \
            --profile ${{ github.event_name == 'push' && 'delivery' || 'candidate' }}
      # RAW DIAGNOSTIC upload: a red run must remain auditable, so always(). Its path is
      # STATICALLY nonempty — deterministic directories under the runner temp root — so a step
      # that never ran cannot turn the path input into the empty string.
      - name: Upload C15 + C16 + C17 raw gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-gate-evidence-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c15-out
            ${{ runner.temp }}/c16-out
            ${{ runner.temp }}/c17-out
          if-no-files-found: warn
      # C17.1 F. The archive is built by TRACKED code, inside the run that produced the
      # evidence, so its hosted-run receipt is generated from the real Actions environment
      # rather than asserted afterwards. The verifier then re-checks it in place.
      # GUARDED on the packager's own outcome: this artifact name embeds a digest the packager
      # computes, so uploading after a failed or skipped packager would publish a name bound to
      # nothing. `always() &&` keeps the guard decisive even when a later-ordered step failed.
      - name: Upload the C17 evidence archive
        if: always() && steps.c17_package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # The suffix binds the exact INNER evidence ZIP to GitHub's API-visible artifact
          # metadata. Actions' own artifact digest covers its wrapper ZIP, not this file.
          # Attempt-scoped: Actions refuses to overwrite an existing artifact name, so a
          # rerun would collide; and an unscoped name is indistinguishable from a
          # superseded attempt's. The verifier matches this exact attempt.
          name: c17-evidence-archive-a${{ github.run_attempt }}-${{ env.C17_ZIP_SHA256 }}
          path: ${{ runner.temp }}/c17-pkg
          if-no-files-found: error
      - name: Upload C17 licence + schema evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c17-licence-evidence-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/c17-out
          if-no-files-found: warn
      - name: Upload the inspectable final-evidence ZIP
        if: always() && steps.evidence_zip.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c16-r34-final-evidence-zip-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-evidence
          if-no-files-found: error
