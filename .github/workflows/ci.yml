# The Eye — CI (ADR-P0-16: supply-chain baseline is Phase 0 scope, not deferred)
#
# Remediation R7/R8 notes:
#  - Infrastructure comes up via docker-compose.yml, so CI exercises the SAME
#    digest-pinned images (postgres:18-alpine / redis:8-alpine by sha256) and
#    the SAME loopback + Redis-auth profile as local runs.
#  - Every secret is generated per run (ephemeral) — no fixed reusable
#    credentials anywhere in the pipeline.
#  - The supply-chain job scans BOTH the repository filesystem (labeled as a
#    filesystem scan) AND the exact pinned container images (labeled as image
#    scans, blocking at HIGH/CRITICAL; .trivyignore holds the dated CVE-level
#    dispositions). A digest-consistency step proves the scanned digests are
#    the ones in docker-compose.yml and conformance.manifest.json.
#  - This workflow defines the gate pipeline. For the local-only Phase 0 gate,
#    local-equivalent evidence (same commands, raw logs) is what is presented;
#    no hosted-CI execution is claimed. Jobs: 3 (build-test,
#    browser-regression, supply-chain).
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.11.1, cache: pnpm }
      - name: Generate ephemeral run secrets (R7 — no fixed credentials)
        run: |
          gen() { openssl rand -hex 24; }
          {
            echo "EYE_DB_PASSWORD=$(gen)"
            echo "EYE_DB_APP_PASSWORD=$(gen)"
            echo "EYE_DB_ALLOCATOR_PASSWORD=$(gen)"
            echo "EYE_DB_SYSTEM_PASSWORD=$(gen)"
            echo "EYE_DB_COMMIT_PASSWORD=$(gen)"
            echo "EYE_DB_IDENTITY_PASSWORD=$(gen)"
            echo "EYE_DB_PUBLISHER_PASSWORD=$(gen)"
            echo "EYE_DB_VERIFIER_PASSWORD=$(gen)"
            echo "EYE_DB_RECOVERY_PASSWORD=$(gen)"
            echo "EYE_TEST_BOOTSTRAP_PASSWORD=$(gen)"
            echo "EYE_TEST_ADMIN_PASSWORD=$(gen)"
            echo "EYE_REDIS_PASSWORD=$(gen)"
            echo "EYE_IDENTITY_JWT_SECRET=$(gen)$(gen)"
          } >> "$GITHUB_ENV"
      - name: Compose up (digest-pinned postgres/redis, loopback, redis auth)
        run: docker compose up -d --wait
      - name: Install (frozen lockfile — pinned dependency closure)
        run: pnpm install --frozen-lockfile
      - name: Module boundaries (ES-65-003, blocking)
        run: pnpm boundaries
      # Gate-2 §10: typecheck runs BEFORE build and must pass from a genuinely
      # clean checkout. Workspace packages expose their sources through the
      # "development" export condition, so no pre-built dist is required.
      # This step also asserts that no stale dist/.next/tsbuildinfo is present.
      - name: Clean-source typecheck + build (blocking, real CI order)
        run: bash scripts/verify-clean-typecheck.sh
      # Gate-2.1 §9: the supply-chain ARTIFACT gates assert the SBOM, licence
      # inventories and bidirectional reconciliation report that were actually
      # produced, so the generators run BEFORE the test step that checks them. The
      # pure gate LOGIC (negative fixtures) needs no artifacts and runs regardless.
      # Gate-2.2 C16: the licence inventory is still a declared precondition of the
      # G21-21 artifact gate. The Gate-2.1 SBOM generator is NOT run: its
      # "bidirectional" reconciliation compared two structures derived from the same
      # generated SBOM, so it could not fail. It is superseded by the C16 runner below,
      # which the artifact gate invokes itself into a temporary directory.
      - name: Supply-chain gate input (licence inventory)
        run: node scripts/license-inventory.mjs
      # C16 closure gate, BLOCKING, into an explicit per-run temporary directory. The
      # generated artifacts are never read from a gitignored path, so a clean checkout
      # and a developer machine with leftover outputs behave identically.
      - name: C16 target-resolved closure gate (blocking)
        run: |
          C16_OUT="$(mktemp -d)"
          echo "C16 run directory: $C16_OUT"
          node scripts/gate/generate-closures.mjs --out "$C16_OUT"
          test -s "$C16_OUT/closure-reconciliation.json"
          test -s "$C16_OUT/sbom-linux-x64-glibc-prod.cdx.json"
          test -s "$C16_OUT/sbom-linux-x64-glibc-dev.cdx.json"
      - name: Unit + conformance + supply-chain gate tests (golden fixtures, negative fixtures, shipped artifacts)
        run: pnpm test
      - name: Migrations + acceptance suite (15 criteria + request paths + R4/R10)
        # Acceptance runs BEFORE integration: the acceptance beforeAll relies on
        # the one-shot bootstrap creating the reserved `platform-admin`; the
        # integration suites intentionally create additional platform_admin
        # principals, which would make the (correct) one-shot bootstrap refuse.
        env:
          EYE_DB_HOST: localhost
          EYE_DB_MIGRATE_PASSWORD: ${{ env.EYE_DB_PASSWORD }}
        run: |
          pnpm db:migrate
          pnpm --filter @eye/api test:accept
      - name: Integration tests (isolation, privileges, audit concurrency, refresh)
        env:
          EYE_DB_HOST: localhost
          EYE_DB_MIGRATE_PASSWORD: ${{ env.EYE_DB_PASSWORD }}
        run: pnpm --filter @eye/api test:int

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.11.1, cache: pnpm }
      - name: Generate ephemeral run secrets (R7 — no fixed credentials)
        run: |
          gen() { openssl rand -hex 24; }
          {
            echo "EYE_DB_PASSWORD=$(gen)"
            echo "EYE_DB_APP_PASSWORD=$(gen)"
            echo "EYE_DB_ALLOCATOR_PASSWORD=$(gen)"
            echo "EYE_DB_SYSTEM_PASSWORD=$(gen)"
            echo "EYE_DB_COMMIT_PASSWORD=$(gen)"
            echo "EYE_DB_IDENTITY_PASSWORD=$(gen)"
            echo "EYE_DB_PUBLISHER_PASSWORD=$(gen)"
            echo "EYE_DB_VERIFIER_PASSWORD=$(gen)"
            echo "EYE_DB_RECOVERY_PASSWORD=$(gen)"
            echo "EYE_TEST_BOOTSTRAP_PASSWORD=$(gen)"
            echo "EYE_TEST_ADMIN_PASSWORD=$(gen)"
            echo "EYE_REDIS_PASSWORD=$(gen)"
            echo "EYE_IDENTITY_JWT_SECRET=$(gen)$(gen)"
          } >> "$GITHUB_ENV"
      - name: Compose up (digest-pinned postgres/redis, loopback, redis auth)
        run: docker compose up -d --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chrome (stable channel)
        run: pnpm exec playwright install chrome
      - name: Phase 0 browser regression gate (10 scenarios, blocking)
        env:
          EYE_DB_HOST: localhost
          EYE_DB_MIGRATE_PASSWORD: ${{ env.EYE_DB_PASSWORD }}
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results/ }

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.11.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Gate-2.2 C15/C16: the supply-chain gate is the TRACKED runner in
      # scripts/gate/, not a set of marketplace actions. The runner verifies every tool
      # pin BEFORE scanning and fails closed on a mismatch, enforces the vulnerability
      # database's identity and freshness, resolves each multi-arch image index to its
      # exact linux/amd64 child, and records raw stdout/stderr digests per step. A scan
      # from an unknown scanner version, or against a stale database, is not evidence.
      - name: Install PINNED scanner binaries (exact versions the runner requires)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          TRIVY_VERSION=0.73.0
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          sudo chmod +x /usr/local/bin/gitleaks /usr/local/bin/trivy
      - name: Verify scanner + toolchain versions are EXACTLY the pinned ones
        run: |
          set -euo pipefail
          check() { got="$2"; want="$3"; [ "$got" = "$want" ] || { echo "$1: got '$got', want '$want'"; exit 1; }; echo "$1 = $got"; }
          check node     "$(node --version)"    "v24.11.1"
          check pnpm     "$(pnpm --version)"    "11.9.0"
          check gitleaks "$(gitleaks version)"  "8.30.1"
          check trivy    "$(trivy --version | sed -n 's/^Version: *//p' | head -1)" "0.73.0"
      - name: Download the trivy vulnerability database (the runner enforces its freshness)
        run: |
          trivy image --download-db-only
          trivy --version --format json
      - name: Pinned-digest consistency (compose == manifest)
        run: |
          PG_DIGEST=$(python3 -c "import json;print(json.load(open('conformance.manifest.json'))['pinned_images']['postgres']['digest'])")
          REDIS_DIGEST=$(python3 -c "import json;print(json.load(open('conformance.manifest.json'))['pinned_images']['redis']['digest'])")
          grep -qF "image: $PG_DIGEST" docker-compose.yml || { echo "compose postgres digest != manifest"; exit 1; }
          grep -qF "image: $REDIS_DIGEST" docker-compose.yml || { echo "compose redis digest != manifest"; exit 1; }
      # BLOCKING. 8 steps, 6 blocking; the 2 non-blocking steps are alternate output
      # FORMATS of scans that already ran blocking with the same pinned tool, and the
      # runner fails if any non-blocking step adds coverage nothing blocking enforces.
      - name: C15 supply-chain gate (tracked pinned runner, blocking)
        run: |
          C15_OUT="$(mktemp -d)"
          echo "C15_OUT=$C15_OUT" >> "$GITHUB_ENV"
          node scripts/gate/supply-chain.mjs --out "$C15_OUT"
      # BLOCKING. Generated into an explicit per-run temporary directory: no test and no
      # step reads a gitignored path, so a clean checkout behaves identically to a
      # developer machine that has leftover preliminary outputs.
      - name: C16 target-resolved closure gate (tracked runner, blocking)
        run: |
          C16_OUT="$(mktemp -d)"
          echo "C16_OUT=$C16_OUT" >> "$GITHUB_ENV"
          node scripts/gate/generate-closures.mjs --out "$C16_OUT"
      - name: License inventory (allowlist-checked over PRODUCTION AND DEVELOPMENT, blocking)
        run: node scripts/license-inventory.mjs
      - name: Upload C15 + C16 raw gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-gate-evidence
          path: |
            ${{ env.C15_OUT }}
            ${{ env.C16_OUT }}
          if-no-files-found: error
