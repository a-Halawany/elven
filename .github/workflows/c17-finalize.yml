# C17.2 I — POST-RUN, CROSS-HOST EVIDENCE FINALIZATION.
#
# The Linux source run cannot prove its own eventual conclusion or artifact listing. This
# workflow starts only after that run completes successfully, downloads that run's exact C17
# archive, independently regenerates C16/C17 on GitHub's macOS-14 ARM64 runner, compares the
# code-owned nine-artifact set byte-for-byte, and uploads one deterministic finalized ZIP.
#
# The finalizer itself cannot query its own future conclusion/artifact while it is running.
# Reviewers therefore run `c17-cross-host-finalization.mjs verify --online` after completion; that
# command verifies BOTH the source run and this finalizer run/job/steps/artifact against code-owned
# GitHub API endpoints.
name: C17 finalize
on:
  workflow_run:
    workflows: ['ci']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out the EXACT source the run was made from
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - name: Install dependencies (materializes the declared linux-x64-glibc target)
        run: pnpm install --frozen-lockfile
      - name: Download the archive the SOURCE run produced
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Scoped to the SOURCE workflow's run attempt: after a full re-run, artifacts from the
          # superseded attempt legitimately remain on the run, and an unscoped pattern would merge
          # them into `incoming` beside the current attempt's archive.
          pattern: c17-evidence-archive-a${{ github.event.workflow_run.run_attempt }}-*
          merge-multiple: true
          path: incoming
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the source C17 archive online and hosted
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COUNT="$(find incoming -type f -name 'c17-evidence-*.zip' | wc -l | tr -d ' ')"
          test "$COUNT" = 1
          SOURCE_ZIP="$(find incoming -type f -name 'c17-evidence-*.zip')"
          echo "C17_SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          node scripts/gate/package-c17-evidence.mjs verify \
            --zip "$SOURCE_ZIP" --root "$PWD" --profile delivery --online --require-hosted
      - name: Generate FINAL C16 + C17 artifacts on macOS ARM64
        run: |
          set -euo pipefail
          C16_OUT="$(mktemp -d)"
          C17_OUT="$(mktemp -d)"
          RECEIPT="$(mktemp -d)/finalizer-receipt.json"
          AS_OF="$(node scripts/gate/c17-cross-host-finalization.mjs receipt \
            --source-zip "$C17_SOURCE_ZIP" --out "$RECEIPT")"
          echo "C17_DARWIN_C16=$C16_OUT" >> "$GITHUB_ENV"
          echo "C17_DARWIN_C17=$C17_OUT" >> "$GITHUB_ENV"
          node scripts/gate/generate-closures.mjs \
            --out "$C16_OUT" --final --expected-sha "${{ github.event.workflow_run.head_sha }}"
          node scripts/gate/licence-obligations.mjs \
            --out "$C17_OUT" --as-of "$AS_OF" \
            --final --expected-sha "${{ github.event.workflow_run.head_sha }}"
      - name: Create + verify the finalized cross-host evidence
        id: finalize_package
        run: |
          set -euo pipefail
          # Deterministic path under the runner temp root, so the upload's path input is
          # statically nonempty. The finalizer requires this directory to be empty and it is
          # created fresh here.
          FINALIZED="$RUNNER_TEMP/finalized"
          mkdir -p "$FINALIZED"
          node scripts/gate/c17-cross-host-finalization.mjs create \
            --source-zip "$C17_SOURCE_ZIP" \
            --darwin-c16 "$C17_DARWIN_C16" \
            --darwin-c17 "$C17_DARWIN_C17" \
            --finalizer-receipt "$C17_FINALIZER_RECEIPT" \
            --out "$FINALIZED"
          COUNT="$(find "$FINALIZED" -type f -name 'c17-cross-host-finalized-*.zip' | wc -l | tr -d ' ')"
          test "$COUNT" = 1
          FINAL_ZIP="$(find "$FINALIZED" -type f -name 'c17-cross-host-finalized-*.zip')"
          FINAL_DIGEST="$(cut -d' ' -f1 "$FINAL_ZIP.sha256")"
          node scripts/gate/c17-cross-host-finalization.mjs verify \
            --zip "$FINAL_ZIP" --root "$PWD"
          {
            echo '### C17.2 cross-host finalization'
            echo
            echo "- source run: ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}"
            echo "- source SHA: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- final ZIP: \`$(basename "$FINAL_ZIP")\`"
            echo "- final ZIP SHA-256: \`$FINAL_DIGEST\`"
            echo '- Linux/macOS exact-nine comparison: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the FINALIZED cross-host evidence
        # Guarded on the producing step: the name embeds a digest that step computes.
        if: always() && steps.finalize_package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # The API-authenticated artifact name commits to the exact INNER finalized ZIP bytes
          # and to this finalizer run's OWN attempt (the source attempt is scoped at download).
          # The REST `digest` is also required by the verifier, but describes Actions' wrapper ZIP.
          name: c17-evidence-finalized-a${{ github.run_attempt }}-${{ env.C17_FINALIZED_SHA256 }}
          path: ${{ runner.temp }}/finalized
          if-no-files-found: error
