# C17.2 C — POST-RUN EVIDENCE FINALIZATION.
#
# ── WHY A SECOND WORKFLOW ────────────────────────────────────────────────────────
# The evidence archive is built inside the CI run so its receipt comes from the real Actions
# environment. But at that moment the run is still in progress: its own job conclusions do not
# exist yet, and neither does its artifact listing. A verifier asked to confirm "all three jobs
# succeeded" from inside one of those jobs would be asking about the future.
#
# So verification of the hosted claim happens HERE, after the source run has completed, triggered
# by `workflow_run`. This workflow re-reads the archive the source run produced and verifies it in
# required-hosted online mode against GitHub's public API — at which point job conclusions,
# steps and artifacts are all real facts about a finished run.
#
# Nothing here pretends information was known earlier than it was: the source run records what it
# can observe, and this run records what only it can observe.
name: C17 finalize
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    # Only a SUCCESSFUL run on main can produce final evidence.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the EXACT source the run was made from
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies (materializes the declared linux-x64-glibc target)
        run: pnpm install --frozen-lockfile
      - name: Download the archive the SOURCE run produced
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: c17-evidence-archive
          path: incoming
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the archive in REQUIRED-HOSTED ONLINE mode against the public API
        env:
          # Used only for API rate limiting; the endpoint is constructed in code and this token
          # cannot redirect it. See scripts/gate/lib/hosted-run.mjs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP="$(ls incoming/c17-evidence-*.zip)"
          echo "verifying $ZIP against run ${{ github.event.workflow_run.id }}"
          node scripts/gate/package-c17-evidence.mjs verify \
            --zip "$ZIP" --root "$PWD" --online --require-hosted
          {
            echo "### C17 evidence finalization"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| source run | ${{ github.event.workflow_run.id }} |"
            echo "| head SHA | \`${{ github.event.workflow_run.head_sha }}\` |"
            echo "| archive | \`$(basename "$ZIP")\` |"
            echo "| archive sha256 | \`$(sha256sum "$ZIP" | cut -d' ' -f1)\` |"
            echo "| verification | required-hosted online: PASS |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write the finalization receipt
        run: |
          set -euo pipefail
          ZIP="$(ls incoming/c17-evidence-*.zip)"
          mkdir -p finalized
          cat > finalized/finalization-receipt.json <<JSON
          {
            "finalized_by_run": "${{ github.run_id }}",
            "finalized_by_attempt": "${{ github.run_attempt }}",
            "finalizer_workflow": "${{ github.workflow }}",
            "source_run": "${{ github.event.workflow_run.id }}",
            "source_run_attempt": "${{ github.event.workflow_run.run_attempt }}",
            "source_conclusion": "${{ github.event.workflow_run.conclusion }}",
            "head_sha": "${{ github.event.workflow_run.head_sha }}",
            "head_branch": "${{ github.event.workflow_run.head_branch }}",
            "event": "${{ github.event.workflow_run.event }}",
            "archive": "$(basename "$ZIP")",
            "archive_sha256": "$(sha256sum "$ZIP" | cut -d' ' -f1)",
            "archive_bytes": $(stat -c%s "$ZIP"),
            "verification_mode": "online+require-hosted",
            "verification_result": "PASS"
          }
          JSON
          cp "$ZIP" finalized/
          cat finalized/finalization-receipt.json
      - name: Upload the FINALIZED evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c17-evidence-finalized
          path: finalized
          if-no-files-found: error
