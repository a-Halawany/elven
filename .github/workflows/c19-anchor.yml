# C19 — EXTERNAL ANCHORING.
#
# This workflow is the ONLY place a Rekor publication can originate, and the guards that make that
# true are structural rather than procedural.
#
# ── WHY `workflow_run` AND NOT `push` ──
#
# A `push` trigger would run this workflow on every branch, and the publication step would then be
# gated by an `if:` alone. That is one edit away from firing. `workflow_run` after `ci` means the
# workflow cannot start at all unless a completed `ci` run exists, and the conditions below then
# require that run to have succeeded, on main, from a push, in this exact repository. A pull
# request, a fork, a manual dispatch and a branch run each fail a DIFFERENT one of those, so no
# single mistake reaches publication.
#
# ── PERMISSIONS ──
#
# The workflow default is read-only. `id-token: write` is granted to the publish job ALONE, because
# that token is the credential that mints a signing identity: any other job holding it could sign
# as this workflow. There is no `contents: write` anywhere, and nothing here creates a release or a
# tag.
name: C19 anchor
on:
  workflow_run:
    workflows: ['ci']
    types: [completed]

# Read-only by default. Publication capability is granted per job, never here.
permissions:
  contents: read
  actions: read

concurrency:
  # One publication per source commit. A re-run that overlaps its predecessor would otherwise race
  # to sign the same bytes twice; `cancel-in-progress: false` lets the first finish rather than
  # leaving a half-published attempt behind.
  group: c19-anchor-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  # ── GATE ────────────────────────────────────────────────────────────────────────
  # Every condition for publication is evaluated HERE, in one place, and exported as a single
  # boolean. Splitting them across steps is how one of them quietly stops being checked.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publishable: ${{ steps.decide.outputs.publishable }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Decide whether this run may publish
        id: decide
        env:
          EV: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
          SRC_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          IS_FORK: ${{ github.event.workflow_run.head_repository.fork }}
        run: |
          set -euo pipefail
          reason=""
          # Each condition is named, so a refusal says WHICH one failed rather than just "no".
          # The first failure is kept: a later check overwriting it would report the wrong cause.
          note() { [ -n "$reason" ] || reason="$1"; }
          [ "$EV" = "push" ]                   || note "upstream event was '$EV', not a push"
          [ "$CONCLUSION" = "success" ]        || note "upstream run concluded '$CONCLUSION'"
          [ "$BRANCH" = "main" ]               || note "upstream branch was '$BRANCH', not main"
          [ "$REPO" = "a-Halawany/elven" ]     || note "repository is '$REPO'"
          [ "$SRC_REPO" = "a-Halawany/elven" ] || note "source repository is '$SRC_REPO'"
          [ "$IS_FORK" != "true" ]             || note "the upstream run came from a fork"
          if [ -n "$reason" ]; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "C19: publication refused — $reason"
          else
            echo "publishable=true" >> "$GITHUB_OUTPUT"
            echo "reason=all publication conditions hold" >> "$GITHUB_OUTPUT"
          fi

  # ── VERIFY (no publication capability whatsoever) ───────────────────────────────
  # Runs on both platforms. It holds NO id-token, so even a compromised step here cannot sign.
  verify:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: C19 offline anchor verification (no network reliance)
        run: node scripts/gate/c19-anchor-cli.mjs selftest --offline
      - name: C19 lifecycle and containment controls
        run: pnpm --filter @eye/api exec vitest run --config vitest.c18-serial.config.ts
      - name: Prove no owned process or docker resource survived
        run: node scripts/gate/c19-anchor-cli.mjs leftovers

  # ── PUBLISH (the only job that can reach Rekor) ─────────────────────────────────
  publish:
    needs: [guard, verify]
    # Structurally unreachable unless the guard job said yes. `needs: verify` additionally means a
    # failure on EITHER platform blocks publication.
    if: needs.guard.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      # The signing capability, granted to this job and nowhere else.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Install the pinned cosign and verify what was installed
        env:
          COSIGN_VERSION: v2.4.1
          # The published digest of that exact release asset, taken from the release's own
          # checksums file. Pinning the version alone is not enough: a tag can be moved.
          COSIGN_SHA256: 8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b
        run: |
          set -euo pipefail
          # The release is PINNED and its digest is VERIFIED before the binary is ever executed. An
          # unverified download that then signs on our behalf would make the supply chain the
          # weakest link in a gate whose entire subject is provenance.
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          actual="$(sha256sum /tmp/cosign | cut -d' ' -f1)"
          if [ "$actual" != "$COSIGN_SHA256" ]; then
            echo "C19: cosign digest mismatch — expected $COSIGN_SHA256, got $actual" >&2
            exit 1
          fi
          echo "C19: cosign $COSIGN_VERSION verified against its published digest"
          chmod +x /tmp/cosign
          /tmp/cosign version
      - name: Publication dry run — everything except the irreversible step
        env:
          # The OIDC token is requested by cosign at the moment of signing and is never written to
          # a file, an output, an environment file or a log.
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/gate/c19-anchor-cli.mjs publish --dry-run
      - name: Recover or publish, idempotently
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COSIGN: /tmp/cosign
        # An entry Rekor already accepted must be FOUND and reused, never signed again: a second
        # signing event for the same bytes is a second identity assertion, and it makes the log a
        # record of our retries rather than of our releases.
        run: node scripts/gate/c19-anchor-cli.mjs publish --recover-or-publish
      - name: Verify the published bundle offline before trusting it
        run: node scripts/gate/c19-anchor-cli.mjs verify --offline --require-delivery-standing
