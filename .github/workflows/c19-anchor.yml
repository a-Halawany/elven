# C19 — EXTERNAL ANCHORING.
#
# This workflow is the ONLY place a Rekor publication can originate, and the guards that make that
# true are structural rather than procedural.
#
# ── WHY `workflow_run` AND NOT `push` ──
#
# A `push` trigger would run this workflow on every branch, and the publication step would then be
# gated by an `if:` alone. That is one edit away from firing. `workflow_run` after `ci` means the
# workflow cannot start at all unless a completed `ci` run exists, and the conditions below then
# require that run to have succeeded, on main, from a push, in this exact repository. A pull
# request, a fork, a manual dispatch and a branch run each fail a DIFFERENT one of those, so no
# single mistake reaches publication.
#
# ── PERMISSIONS ──
#
# The workflow default is read-only. `id-token: write` is granted to the publish job ALONE, because
# that token is the credential that mints a signing identity: any other job holding it could sign
# as this workflow. There is no `contents: write` anywhere, and nothing here creates a release or a
# tag.
name: C19 anchor
on:
  workflow_run:
    # ── TRIGGERED BY THE FINALIZER, NOT BY ci ──
    #
    # `C17 finalize` and this workflow were both triggered by `ci` completing, so they RACED: this
    # one could query for a finalizer run before that finalizer had succeeded, or at all. Depending
    # on the finalizer means waiting for it by construction rather than hoping it got there first.
    workflows: ['C17 finalize']
    types: [completed]

# Read-only by default. Publication capability is granted per job, never here.
permissions:
  contents: read
  actions: read

concurrency:
  # One publication per source commit. A re-run that overlaps its predecessor would otherwise race
  # to sign the same bytes twice; `cancel-in-progress: false` lets the first finish rather than
  # leaving a half-published attempt behind.
  group: c19-anchor-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  # ── GATE ────────────────────────────────────────────────────────────────────────
  # Every condition for publication is evaluated HERE, in one place, and exported as a single
  # boolean. Splitting them across steps is how one of them quietly stops being checked.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publishable: ${{ steps.decide.outputs.publishable }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Decide whether this run may publish
        id: decide
        env:
          EV: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
          SRC_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          IS_FORK: ${{ github.event.workflow_run.head_repository.fork }}
        run: |
          set -euo pipefail
          reason=""
          # Each condition is named, so a refusal says WHICH one failed rather than just "no".
          # The first failure is kept: a later check overwriting it would report the wrong cause.
          note() { [ -n "$reason" ] || reason="$1"; }
          # The finalizer is itself workflow_run-triggered by ci; its own upstream event is what
          # must have been a push.
          [ "$EV" = "workflow_run" ]           || note "finalizer event was '$EV', not workflow_run"
          [ "$CONCLUSION" = "success" ]        || note "upstream run concluded '$CONCLUSION'"
          [ "$BRANCH" = "main" ]               || note "upstream branch was '$BRANCH', not main"
          [ "$REPO" = "a-Halawany/elven" ]     || note "repository is '$REPO'"
          [ "$SRC_REPO" = "a-Halawany/elven" ] || note "source repository is '$SRC_REPO'"
          [ "$IS_FORK" != "true" ]             || note "the upstream run came from a fork"
          if [ -n "$reason" ]; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "C19: publication refused — $reason"
          else
            echo "publishable=true" >> "$GITHUB_OUTPUT"
            echo "reason=all publication conditions hold" >> "$GITHUB_OUTPUT"
          fi

  # ── VERIFY (no publication capability whatsoever) ───────────────────────────────
  # Runs on both platforms. It holds NO id-token, so even a compromised step here cannot sign.
  verify:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The serial controls import @eye/contracts from BUILT output. This repeats the exact defect
      # already found and fixed in c19-lifecycle.yml; omitting it here would have failed the same
      # way the moment this workflow first ran.
      - run: pnpm build
      - name: C19 offline anchor verification (no network reliance)
        run: node scripts/gate/c19-anchor-cli.mjs selftest --offline
      - name: C19 lifecycle and containment controls
        run: pnpm --filter @eye/api exec vitest run --config vitest.c18-serial.config.ts
      - name: Prove no owned process or docker resource survived
        run: node scripts/gate/c19-anchor-cli.mjs leftovers

  # ── PUBLISH (the only job that can reach Rekor) ─────────────────────────────────
  publish:
    needs: [guard, verify]
    # Structurally unreachable unless the guard job said yes. `needs: verify` additionally means a
    # failure on EITHER platform blocks publication.
    if: needs.guard.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      # The signing capability, granted to this job and nowhere else.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Install the pinned cosign and verify what was installed
        env:
          COSIGN_VERSION: v2.4.1
          # The published digest of that exact release asset, taken from the release's own
          # checksums file. Pinning the version alone is not enough: a tag can be moved.
          COSIGN_SHA256: 8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b
        run: |
          set -euo pipefail
          # The release is PINNED and its digest is VERIFIED before the binary is ever executed. An
          # unverified download that then signs on our behalf would make the supply chain the
          # weakest link in a gate whose entire subject is provenance.
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          actual="$(sha256sum /tmp/cosign | cut -d' ' -f1)"
          if [ "$actual" != "$COSIGN_SHA256" ]; then
            echo "C19: cosign digest mismatch — expected $COSIGN_SHA256, got $actual" >&2
            exit 1
          fi
          echo "C19: cosign $COSIGN_VERSION verified against its published digest"
          chmod +x /tmp/cosign
          /tmp/cosign version
      # ── ACQUIRE THE EXACT FINALIZED ARTIFACT ────────────────────────────────
      # Previously this workflow signed and "verified" nothing: no artifact was ever downloaded and
      # no --artifact/--bundle path was passed, so the step named "verify the published bundle"
      # verified no bundle. The delivery chain is now explicit and every binding is checked.
      - name: Refuse a superseded (non-canonical) attempt
        env:
          GH_TOKEN: ${{ github.token }}
          FIN_RUN: ${{ github.event.workflow_run.id }}
          FIN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        # A later successful rerun of the upstream run carries a different attempt number, and
        # because the attempt is part of the publication identity that would mint a SECOND identity
        # for evidence already published. Only the canonical EARLIEST successful attempt may
        # publish; a later one must resolve to the existing publication or be refused. GitHub
        # incrementing an attempt number must never be able to create a second publication.
        run: |
          set -euo pipefail
          canonical=""
          for n in $(seq 1 "$FIN_ATTEMPT"); do
            c="$(gh api "repos/${{ github.repository }}/actions/runs/$FIN_RUN/attempts/$n" \
              --jq .conclusion 2>/dev/null || echo "")"
            if [ "$c" = "success" ]; then canonical="$n"; break; fi
          done
          if [ -z "$canonical" ]; then
            echo "::error::no successful attempt of run $FIN_RUN; there is nothing to publish"
            exit 1
          fi
          if [ "$canonical" != "$FIN_ATTEMPT" ]; then
            echo "::error::attempt $FIN_ATTEMPT is superseded: attempt $canonical already succeeded"
            echo "::error::and owns this publication identity. Publishing here would create a"
            echo "::error::second signing event for evidence that is already published."
            exit 1
          fi
          echo "attempt $FIN_ATTEMPT is the canonical earliest successful attempt"

      - name: Resolve the finalizer that triggered us, and ITS source run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          FIN_RUN: ${{ github.event.workflow_run.id }}
          FIN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # We were triggered BY this finalizer, so no search is needed and no race exists. What
          # must still be established is which source run it finalized — selecting "any successful
          # finalizer with the same SHA" would accept one belonging to a different source run.
          fin="$(gh api "repos/${{ github.repository }}/actions/runs/$FIN_RUN")"
          [ "$(echo "$fin" | jq -r .conclusion)" = "success" ] || { echo "::error::finalizer did not succeed"; exit 1; }
          src_id="$(echo "$fin" | jq -r '.referenced_workflows[0].sha // empty')"
          # The finalizer records its triggering run in its own workflow_run payload; recover it
          # from the finalizer's logs-independent metadata.
          src="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name=="ci" and .conclusion=="success" and .event=="push")]')"
          n="$(echo "$src" | jq 'length')"
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one successful ci push run for $HEAD_SHA, found $n"
            exit 1
          fi
          # An old successful run must not publish after main has moved on.
          tip="$(gh api repos/${{ github.repository }}/commits/main --jq .sha)"
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "::error::head $HEAD_SHA is no longer the main tip ($tip); superseded"
            exit 1
          fi
          {
            echo "finalizer_run=$FIN_RUN"
            echo "finalizer_attempt=$FIN_ATTEMPT"
            echo "finalizer_completed_at=$(echo "$fin" | jq -r .updated_at)"
            echo "source_run=$(echo "$src" | jq -r '.[0].id')"
            echo "source_attempt=$(echo "$src" | jq -r '.[0].run_attempt')"
            echo "source_event=$(echo "$src" | jq -r '.[0].event')"
            echo "source_tree=$(git rev-parse "$HEAD_SHA^{tree}")"
            echo "workflow_digest=$(sha256sum .github/workflows/c19-anchor.yml | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Acquire the artifact, authenticate the wrapper, and verify the inner evidence
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          FIN_RUN: ${{ steps.resolve.outputs.finalizer_run }}
          SOURCE_RUN: ${{ steps.resolve.outputs.source_run }}
          SOURCE_ATTEMPT: ${{ steps.resolve.outputs.source_attempt }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c19
          node scripts/gate/c19-acquire.mjs \
            --repo "${{ github.repository }}" \
            --finalizer-run "$FIN_RUN" \
            --source-run "$SOURCE_RUN" \
            --source-attempt "$SOURCE_ATTEMPT" \
            --out /tmp/c19 >> "$GITHUB_OUTPUT"

      - name: Build the canonical signed payload
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_TREE: ${{ steps.resolve.outputs.source_tree }}
          SOURCE_RUN_ID: ${{ steps.resolve.outputs.source_run }}
          SOURCE_RUN_ATTEMPT: ${{ steps.resolve.outputs.source_attempt }}
          SOURCE_EVENT: ${{ steps.resolve.outputs.source_event }}
          FINALIZER_RUN_ID: ${{ steps.resolve.outputs.finalizer_run }}
          FINALIZER_RUN_ATTEMPT: ${{ steps.resolve.outputs.finalizer_attempt }}
          FINALIZER_COMPLETED_AT: ${{ steps.resolve.outputs.finalizer_completed_at }}
          WORKFLOW_DIGEST: ${{ steps.resolve.outputs.workflow_digest }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          EVIDENCE_DIGEST: ${{ steps.artifact.outputs.wrapper_digest }}
          FINALIZED_INNER_NAME: ${{ steps.artifact.outputs.inner_name }}
          FINALIZED_INNER_DIGEST: ${{ steps.artifact.outputs.inner_digest }}
        run: node scripts/gate/c19-anchor-cli.mjs payload --out /tmp/c19/payload.json

      - name: Publication dry run — everything except the irreversible step
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_TREE: ${{ steps.resolve.outputs.source_tree }}
          SOURCE_RUN_ID: ${{ steps.resolve.outputs.source_run }}
          SOURCE_RUN_ATTEMPT: ${{ steps.resolve.outputs.source_attempt }}
          SOURCE_EVENT: ${{ steps.resolve.outputs.source_event }}
          FINALIZER_RUN_ID: ${{ steps.resolve.outputs.finalizer_run }}
          FINALIZER_RUN_ATTEMPT: ${{ steps.resolve.outputs.finalizer_attempt }}
          WORKFLOW_DIGEST: ${{ steps.resolve.outputs.workflow_digest }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          EVIDENCE_DIGEST: ${{ steps.artifact.outputs.wrapper_digest }}
          FINALIZED_INNER_NAME: ${{ steps.artifact.outputs.inner_name }}
          FINALIZED_INNER_DIGEST: ${{ steps.artifact.outputs.inner_digest }}
          SIGNER_RUN_ID: ${{ github.run_id }}
          SIGNER_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          node scripts/gate/c19-anchor-cli.mjs publish --dry-run \
            --artifact /tmp/c19/finalized.zip \
            --payload  /tmp/c19/payload.json \
            --bundle   /tmp/c19/payload.sigstore.json

      - name: Recover or publish, idempotently
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_TREE: ${{ steps.resolve.outputs.source_tree }}
          SOURCE_RUN_ID: ${{ steps.resolve.outputs.source_run }}
          SOURCE_RUN_ATTEMPT: ${{ steps.resolve.outputs.source_attempt }}
          SOURCE_EVENT: ${{ steps.resolve.outputs.source_event }}
          FINALIZER_RUN_ID: ${{ steps.resolve.outputs.finalizer_run }}
          FINALIZER_RUN_ATTEMPT: ${{ steps.resolve.outputs.finalizer_attempt }}
          WORKFLOW_DIGEST: ${{ steps.resolve.outputs.workflow_digest }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          EVIDENCE_DIGEST: ${{ steps.artifact.outputs.wrapper_digest }}
          FINALIZED_INNER_NAME: ${{ steps.artifact.outputs.inner_name }}
          FINALIZED_INNER_DIGEST: ${{ steps.artifact.outputs.inner_digest }}
          SIGNER_RUN_ID: ${{ github.run_id }}
          SIGNER_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          COSIGN: /tmp/cosign
        run: |
          node scripts/gate/c19-anchor-cli.mjs publish --recover-or-publish \
            --artifact /tmp/c19/finalized.zip \
            --payload  /tmp/c19/payload.json \
            --bundle   /tmp/c19/payload.sigstore.json

      - name: Verify the published bundle OFFLINE against the delivered artifact
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_TREE: ${{ steps.resolve.outputs.source_tree }}
          SOURCE_RUN_ID: ${{ steps.resolve.outputs.source_run }}
          SOURCE_RUN_ATTEMPT: ${{ steps.resolve.outputs.source_attempt }}
          SOURCE_EVENT: ${{ steps.resolve.outputs.source_event }}
          FINALIZER_RUN_ID: ${{ steps.resolve.outputs.finalizer_run }}
          FINALIZER_RUN_ATTEMPT: ${{ steps.resolve.outputs.finalizer_attempt }}
          WORKFLOW_DIGEST: ${{ steps.resolve.outputs.workflow_digest }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          EVIDENCE_DIGEST: ${{ steps.artifact.outputs.wrapper_digest }}
          FINALIZED_INNER_NAME: ${{ steps.artifact.outputs.inner_name }}
          FINALIZED_INNER_DIGEST: ${{ steps.artifact.outputs.inner_digest }}
          SIGNER_RUN_ID: ${{ github.run_id }}
          SIGNER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node scripts/gate/c19-anchor-cli.mjs verify --offline --require-delivery-standing \
            --artifact /tmp/c19/finalized.zip \
            --payload  /tmp/c19/payload.json \
            --bundle   /tmp/c19/payload.sigstore.json

      - name: Verify again from a FRESH FOREIGN CHECKOUT, offline
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_TREE: ${{ steps.resolve.outputs.source_tree }}
          SOURCE_RUN_ID: ${{ steps.resolve.outputs.source_run }}
          SOURCE_RUN_ATTEMPT: ${{ steps.resolve.outputs.source_attempt }}
          SOURCE_EVENT: ${{ steps.resolve.outputs.source_event }}
          FINALIZER_RUN_ID: ${{ steps.resolve.outputs.finalizer_run }}
          FINALIZER_RUN_ATTEMPT: ${{ steps.resolve.outputs.finalizer_attempt }}
          WORKFLOW_DIGEST: ${{ steps.resolve.outputs.workflow_digest }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          EVIDENCE_DIGEST: ${{ steps.artifact.outputs.wrapper_digest }}
          FINALIZED_INNER_NAME: ${{ steps.artifact.outputs.inner_name }}
          FINALIZED_INNER_DIGEST: ${{ steps.artifact.outputs.inner_digest }}
          SIGNER_RUN_ID: ${{ github.run_id }}
          SIGNER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main "${{ github.server_url }}/${{ github.repository }}" /tmp/foreign
          cd /tmp/foreign && git fetch --quiet origin "${{ github.event.workflow_run.head_sha }}" \
            && git checkout --quiet FETCH_HEAD
          node scripts/gate/c19-anchor-cli.mjs verify --offline --require-delivery-standing \
            --artifact /tmp/c19/finalized.zip \
            --payload  /tmp/c19/payload.json \
            --bundle   /tmp/c19/payload.sigstore.json

      - name: Persist the bundle as a digest-bound artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c19-anchor-bundle-${{ steps.artifact.outputs.wrapper_digest }}
          path: |
            /tmp/c19/payload.json
            /tmp/c19/payload.sigstore.json
          if-no-files-found: error
