# ── Is the service still on the compatible official image — or is there a NEWER one? ──
#
# From 2026-09-10 to 2026-09-22 the service images were pinned, TEMPORARILY and by owner approval
# (docs/images/DERIVED_IMAGES_APPROVAL.md), to derived maintenance builds under
# ghcr.io/a-halawany/elven/, because no official postgres:18-alpine or redis:8-alpine build carried
# the util-linux, OpenSSL and c-ares fixes. This check is what noticed the official rebuilds (run
# 35728647457, 2026-09-22); the compose file returned to them the same day, and the owner approved the
# SCX re-issues on 2026-09-23 (docs/SUPPLY_CHAIN_MAINTENANCE_2026-09.md §8).
#
# AFTER THE RETURN it keeps running at the same cadence, because the registry can move on any day
# without anything in this repository changing: CI checks on the next push; this checks on a quiet
# week when there is no push. It resolves the current official index of each service's tag, scans
# both platform children for the fixed package versions, and decides against the CONFIGURED PIN
# (the conformance manifest, which CI holds equal to the compose file):
#   * the tag is the configured pin and every watched fix is present on both platforms  -> PASS;
#   * the tag names a NEWER index that also carries every watched fix on both platforms -> FAIL —
#     a deliberate inversion, because the good news is what has to interrupt someone — and the
#     move to it is a governed operation (re-pin, verify provenance and compatibility, re-issue or
#     retire the SCX records that name the pin, regenerate evidence, FINAL chain; §8.4);
#   * the tag moved to a build that does not carry every watched fix -> nothing to do, said out loud;
#   * the tag is the configured pin but a watched fix is missing, or the check cannot be completed
#     on both platforms -> FAIL, visibly.
# It never re-pins and never deletes evidence.
#
# READ-ONLY. No id-token, no contents:write, no packages, no attestations. It resolves public image
# digests and scans them; it cannot change this repository or sign anything.
name: C15 patched-image recheck

on:
  schedule:
    # 07:20 UTC daily. Off the hour, because the hour is when everyone else's cron runs.
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c15-patched-image-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: "Assert the EXACT permission map — contents: read, nothing else"
        shell: bash
        run: |
          set -euo pipefail
          # Parsed, not grepped. The previous check looked for `id-token: write`, which is one key
          # out of many: contents, packages, attestations, issues and the rest are all writable, and
          # `permissions: write-all` grants every one of them in five words a grep would not match.
          node scripts/gate/assert-readonly-workflow.mjs .github/workflows/c15-patched-image-recheck.yml

      - name: Install the pinned scanners
        run: bash scripts/gate/install-scanners.sh trivy

      - name: Recheck the official images on both platforms against the configured pins
        run: node scripts/gate/check-patched-images.mjs

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::Either a NEWER compatible official build now exists for a service on both platforms —"
          echo "::notice::move the service to it through the governed process (re-pin, verify provenance and"
          echo "::notice::compatibility, re-issue or retire the SCX records that name the current pin, regenerate"
          echo "::notice::evidence, FINAL chain; docs/SUPPLY_CHAIN_MAINTENANCE_2026-09.md §8.4) — or the configured pin"
          echo "::notice::no longer carries every watched fix, or the manifest's recorded children disagree with the"
          echo "::notice::index, or the check could not be completed on both platforms, which is not evidence that"
          echo "::notice::nothing changed. Nothing was re-pinned and no evidence was deleted."
