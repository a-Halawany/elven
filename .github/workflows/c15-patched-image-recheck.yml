# ── Is there a compatible fixed OFFICIAL image yet? ───────────────────────────
#
# Since 2026-09-10 the service images are pinned, TEMPORARILY and by owner approval
# (docs/images/DERIVED_IMAGES_APPROVAL.md), to derived maintenance builds under
# ghcr.io/a-halawany/elven/, because no official postgres:18-alpine or redis:8-alpine build carried
# the util-linux, OpenSSL and c-ares fixes. That route ends the day a compatible fixed official
# image exists for a service on BOTH linux/amd64 and linux/arm64.
#
# That can become true on any day, without anything in this repository changing. CI checks on the
# next push; this checks on a quiet week when there is no push. It resolves the current official
# index for each service's tag, scans both platform children for the fixed package versions, and
# REPORTS. It FAILS when a service qualifies — a deliberate inversion, because the good news is what
# has to interrupt someone — and the return to the official image is then a governed operation
# (re-pin, re-issue or retire the SCX records that name the derived image, regenerate evidence,
# FINAL chain). It never re-pins and never deletes evidence.
#
# READ-ONLY. No id-token, no contents:write, no packages, no attestations. It resolves public image
# digests and scans them; it cannot change this repository or sign anything.
name: C15 patched-image recheck

on:
  schedule:
    # 07:20 UTC daily. Off the hour, because the hour is when everyone else's cron runs.
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c15-patched-image-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: "Assert the EXACT permission map — contents: read, nothing else"
        shell: bash
        run: |
          set -euo pipefail
          # Parsed, not grepped. The previous check looked for `id-token: write`, which is one key
          # out of many: contents, packages, attestations, issues and the rest are all writable, and
          # `permissions: write-all` grants every one of them in five words a grep would not match.
          node scripts/gate/assert-readonly-workflow.mjs .github/workflows/c15-patched-image-recheck.yml

      - name: Install the pinned scanners
        run: bash scripts/gate/install-scanners.sh trivy

      - name: Recheck the official images on both platforms
        run: node scripts/gate/check-patched-images.mjs

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::Either a COMPATIBLE FIXED OFFICIAL image now exists for a service on both platforms —"
          echo "::notice::return that service to it through the governed process (re-pin, re-issue or retire the"
          echo "::notice::SCX records that name the derived image, regenerate evidence, FINAL chain); nothing was"
          echo "::notice::re-pinned and no evidence was deleted — or the check could not be completed on both"
          echo "::notice::platforms, which is not evidence that no such image exists."
