services:
  postgres:
    image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 # postgres:18-alpine (official index, 18.6-alpine3.24; re-pinned 2026-09-22 — was ghcr.io/a-halawany/elven/postgres@sha256:69a974ae… from 2026-09-10)
    container_name: eye-postgres
    # Process protections (2026-09-10; infra/images/candidates/README.md "v3", process
    # protections; measured in infra/images/candidates/evidence/v3/process-protections.txt).
