    user: "999:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--requirepass", "${EYE_REDIS_PASSWORD:?EYE_REDIS_PASSWORD is required (no committed default)}"]
    environment:
      REDIS_HEALTHCHECK_PASSWORD: ${EYE_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_HEALTHCHECK_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eye-pgdata:
